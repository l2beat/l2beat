packages:
  - 'packages/*'

# Only install package versions published at least a week ago, to reduce
# exposure to supply chain attacks in freshly published releases.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@mradomski/tinyerc55@0.1.4'

overrides:
  'form-data@^2': 2.5.4
  'form-data@^4': 4.0.4
  'bn.js@^4': '^4.12.3'
  'bn.js@^5': '^5.2.3'
  'body-parser@^2': '^2.4.0'
  'brace-expansion@^1': '^1.1.21'
  'brace-expansion@^2': '^2.1.7'
  'diff@^5': '^5.2.2'
  'elliptic@^6': '^6.6.1'
  'esbuild@^0.28': '^0.28.2'
  'fflate@^0.7': '^0.7.5'
  'follow-redirects@^1': '^1.16.2'
  'js-yaml@^3': '^3.15.2'
  'js-yaml@^4': '^4.3.2'
  'linkify-it@^5': '^5.0.2'
  'lodash@^4': '^4.18.0'
  'on-headers@^1': '^1.1.0'
  'path-to-regexp@^8': '^8.4.0'
  'proxy-addr@^2': '^2.0.8'
  'qs@^6': '^6.16.1'
  'source-map-js@^1': '^1.2.2'
  'tmp@^0.2': '^0.2.6'
  'undici@^6': '^6.29.1'
  'uuid@^11': '^11.1.1'
  '@ethersproject/providers>ws': '^7.5.11'
  'ws@^8': '^8.21.0'
  'yaml@^2': '^2.8.3'

# pnpm >=10 blocks dependency lifecycle scripts unless explicitly allowed.
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  '@tailwindcss/oxide': true
  cbor-extract: true
  esbuild: true
  prisma: true
