name: Set up Playwright
description: >
  Installs the headless Chromium used by Playwright tests, and WebKit if
  asked, cached per Playwright version. Run after setup-pnpm. WebKit's
  system libraries are installed by the workflow (see ci.yml).

inputs:
  package-dir:
    description: Package whose Playwright version is installed
    required: true
  webkit:
    description: Also install WebKit, for the ratchets that measure Safari's engine
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Read Playwright version
      id: version
      shell: bash
      working-directory: ${{ inputs.package-dir }}
      run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    # Playwright builds browsers per Ubuntu release, so a build cached on one
    # release fails to load its libraries on another, and ubuntu-latest moves
    # between them
    - name: Read runner image
      id: image
      shell: bash
      run: |
        echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
        echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

    - name: Restore Playwright browsers
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ steps.image.outputs.os }}-${{ steps.version.outputs.version }}-headless-shell${{ inputs.webkit == 'true' && '-webkit' || '' }}

    # Headless tests run on the headless shell, so the full Chrome build and
    # ffmpeg are never used. The runner image already has the system libraries.
    - name: Install Playwright browsers
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.package-dir }}
      run: pnpm exec playwright install --only-shell chromium

    - name: Install Playwright WebKit
      if: inputs.webkit == 'true' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.package-dir }}
      run: pnpm exec playwright install webkit
