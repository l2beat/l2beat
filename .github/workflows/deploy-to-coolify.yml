name: Deploy to Coolify

on:
  workflow_call:
    inputs:
      preview:
        description: "Deploy the pull request's preview of the app instead of the app"
        required: false
        type: boolean
        default: false
    secrets:
      COOLIFY_SERVER:
        required: true
      COOLIFY_DEPLOY_API_KEY:
        required: true
      COOLIFY_UUID:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COOLIFY_SERVER: ${{ secrets.COOLIFY_SERVER }}
      COOLIFY_API_KEY: ${{ secrets.COOLIFY_DEPLOY_API_KEY }}
      COOLIFY_UUID: ${{ secrets.COOLIFY_UUID }}
    steps:
      # A missing repo secret arrives as an empty string and would otherwise
      # surface as a confusing 404.
      - name: Validate COOLIFY_UUID
        run: |
          if [[ -z "$COOLIFY_UUID" ]]; then
            echo "::error::COOLIFY_UUID is empty; is the repo secret set?"
            exit 1
          fi

      - name: Deploy to Coolify
        if: ${{ !inputs.preview }}
        run: |
          response="$(
            curl --fail-with-body --silent --show-error \
              -X POST \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              --header "Authorization: Bearer $COOLIFY_API_KEY" \
              --header "Accept: application/json" \
              "$COOLIFY_SERVER/api/v1/deploy?uuid=$COOLIFY_UUID"
          )"

          echo "$response" | jq -e '.deployments | length > 0' >/dev/null
          echo "$response"

      # Opens the preview on the first call and redeploys it afterwards.
      # Retrying is safe: Coolify skips a deployment already queued for the
      # same commit, and curl honours Retry-After when the queue is full.
      - name: Deploy preview to Coolify
        if: ${{ inputs.preview }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body=$(jq -n --argjson pr "$PR_NUMBER" --arg url "$PR_URL" --arg commit "$HEAD_SHA" \
            '{pull_request_id: $pr, pull_request_html_url: $url, commit: $commit}')

          response="$(
            curl --fail-with-body --silent --show-error \
              -X POST \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              --header "Authorization: Bearer $COOLIFY_API_KEY" \
              --header "Accept: application/json" \
              --header "Content-Type: application/json" \
              --data "$body" \
              "$COOLIFY_SERVER/api/v1/applications/$COOLIFY_UUID/previews"
          )"
          echo "$response"

          domains=$(jq -r '.preview.domains // "unknown"' <<< "$response")
          echo "Preview: $domains ($(jq -r .message <<< "$response"))" >> "$GITHUB_STEP_SUMMARY"
