name: Bench Docker builds

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            dockerfile: packages/frontend/Dockerfile
          - name: backend
            dockerfile: packages/backend/Dockerfile
          - name: public-api
            dockerfile: packages/public-api/Dockerfile
          - name: tools-api
            dockerfile: packages/tools-api/Dockerfile
          - name: token-backend
            dockerfile: packages/token-backend/Dockerfile
          - name: disco-ui
            dockerfile: packages/l2b/Dockerfile.disco-ui
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Set up Docker.io mirror
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          build-args: |
            TURBO_TEAM=${{ vars.TURBO_TEAM }}
          secrets: |
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
            TURBO_API=${{ secrets.TURBO_API_RO }}
          no-cache: true
