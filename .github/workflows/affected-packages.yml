name: List affected packages

# Lists the workspace packages that the triggering commit changes, plus every
# package that depends on them. See .github/scripts/affected-packages.sh,
# which CI's per-job check (.github/actions/affected) shares.

on:
  workflow_call:
    outputs:
      packages:
        description: JSON array of package names, e.g. ["@l2beat/frontend"]
        value: ${{ jobs.affected.outputs.packages }}

permissions:
  contents: read

jobs:
  affected:
    name: List affected packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.affected.outputs.packages }}
    steps:
      # The PR head, not the merge commit: see the script
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: List affected packages
        id: affected
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/affected-packages.sh
