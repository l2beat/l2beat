name: List affected packages

# Lists the workspace packages that the triggering commit changes, plus every
# package that depends on them. On main it compares the commit with the previous
# one. On a pull request it compares the PR head with the commit it branched
# from, like the PR's "Files changed" tab, so the list covers the whole PR, not
# just the last push. Not the merge commit: when a PR is retargeted, e.g. a
# stacked PR onto its parent's branch, GitHub fires the event before it rebuilds
# refs/pull/N/merge, which then still diffs against the old base. A change only
# to test files lists nothing.

on:
  workflow_call:
    outputs:
      packages:
        description: JSON array of package names, e.g. ["@l2beat/frontend"]
        value: ${{ jobs.affected.outputs.packages }}

permissions:
  contents: read

jobs:
  affected:
    name: List affected packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.affected.outputs.packages }}
    steps:
      # turbo needs the branch point in the clone to diff against it, so fetch
      # just enough history to reach it. The base branch is read from the API, not
      # the event: a push right before a retarget fires an event that still
      # names the old base.
      - name: Find where the PR branched off
        id: pr
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base_ref=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .base.ref)
          gh api "repos/$GITHUB_REPOSITORY/compare/$base_ref...$HEAD_SHA" \
            --jq '"base=\(.merge_base_commit.sha)\ndepth=\(.ahead_by + 1)"' \
            >> "$GITHUB_OUTPUT"

      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: ${{ steps.pr.outputs.depth || 2 }}
          persist-credentials: false

      # turbo reads the workspace graph from package.json files and the
      # lockfile, so this needs no pnpm install.
      - name: List affected packages
        id: affected
        env:
          TURBO_SCM_BASE: ${{ steps.pr.outputs.base || 'HEAD^1' }}
          TURBO_SCM_HEAD: HEAD
        run: |
          # Tests don't ship, so a change only to them should build and deploy
          # nothing. Mixed with other changes they still count, which is rare
          # enough to accept.
          if git diff --quiet "$TURBO_SCM_BASE" HEAD -- . \
              ':(exclude,glob)**/*.test.ts' ':(exclude,glob)**/*.test.tsx' \
              ':(exclude,glob)**/*.test.ts.snapshot' ':(exclude,glob)**/*.e2e.ts' \
              ':(exclude,glob)**/.mocharc*' ':(exclude,glob)**/playwright.config.ts'; then
            packages='[]'
          else
            turbo_version=$(jq -r .devDependencies.turbo package.json)
            packages=$(npx --yes "turbo@$turbo_version" ls --affected --output=json | jq -c '[.packages.items[].name]')
          fi
          echo "Affected packages: $packages"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
