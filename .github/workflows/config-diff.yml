name: Diff

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # For commenting on PRs

jobs:
  config-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ secrets.TURBO_API_RO }}
    # Unlike diff.sh, main gets its own worktree so both sides build at once.
    # The API gives the merge base, which spares a full-history checkout.
    steps:
      - parallel:
          - name: Find merge base with main
            id: merge-base
            env:
              GH_TOKEN: ${{ github.token }}
            run: |
              sha=$(gh api "repos/${{ github.repository }}/compare/main...${{ github.event.pull_request.head.sha }}" --jq .merge_base_commit.sha)
              echo "sha=$sha" >> $GITHUB_OUTPUT

          - name: Checkout
            uses: actions/checkout@v6
            with:
              ref: ${{ github.event.pull_request.head.sha }}

      - name: Check out main into a worktree
        id: main-worktree
        background: true
        env:
          SHA: ${{ steps.merge-base.outputs.sha }}
        run: |
          git fetch --depth 1 origin $SHA
          git worktree add --detach $RUNNER_TEMP/config-diff-main $SHA

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Wait for main worktree
        wait: main-worktree

      - parallel:
          - name: Build main config
            working-directory: ${{ runner.temp }}/config-diff-main
            run: bash $GITHUB_WORKSPACE/packages/config/scripts/diff/snapshot.sh main

          - name: Build PR config
            run: bash ./packages/config/scripts/diff/snapshot.sh pr

      - name: Compute diff
        id: diff
        working-directory: packages/config
        run: |
          mkdir -p /tmp/compare/out
          pnpm exec tsx scripts/diff/index.ts /tmp/compare/out/index.html /tmp/compare/out/index-llms.txt
          echo "has_changes=$(cat /tmp/compare/out/index.html | grep -c "No changes detected" || true)" >> $GITHUB_OUTPUT

      - name: Publish diff
        id: publish
        if: steps.diff.outputs.has_changes != '1'
        run: |
          URL="https://config-diff-v2.l2beat.com/upload/pr-${{ github.event.pull_request.number }}/"
          curl -f -u "${{ secrets.CONFIG_DIFF_AUTH }}" -T /tmp/compare/out/index.html $URL/index.html
          curl -f -u "${{ secrets.CONFIG_DIFF_AUTH }}" -T /tmp/compare/out/index-llms.txt $URL/index-llms.txt
          echo "domain=$URL" >> $GITHUB_OUTPUT

      - name: Find Comment
        uses: peter-evans/find-comment@v4
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Config Changes Report'

      - name: Get current timestamp
        id: timestamp
        run: echo "value=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: Create or Update Comment (Changes Detected)
        if: steps.diff.outputs.has_changes != '1'
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Config Changes Report
            
            Config changes have been detected between main and this PR.
            
            [View Full Report](${{ steps.publish.outputs.domain }}) · [Plain text for LLMs](${{ steps.publish.outputs.domain }}index-llms.txt)
            
            *Last updated: ${{ steps.timestamp.outputs.value }}*
          edit-mode: replace
          
      - name: Create or Update Comment (No Changes)
        if: steps.diff.outputs.has_changes == '1'
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Config Changes Report
            
            No schema changes detected between main and this PR.
            
            *Last updated: ${{ steps.timestamp.outputs.value }}*
          edit-mode: replace
