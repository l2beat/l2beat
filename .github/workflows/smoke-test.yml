name: Smoke Test

on:
  pull_request:
  merge_group: {}

permissions:
  contents: read

jobs:
  # One runner tests every service's config in turn. Each check takes about
  # a second, so a runner per check spent ~30 s of setup on each, and six
  # runners per push queued behind other PRs' jobs. Each step gets only its
  # own app's ID, and each test runs even after another fails, so one
  # run reports every broken config.
  config-smoke-test:
    if: >
      ${{
        github.event_name == 'merge_group' ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
      }}
    name: Config smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COOLIFY_SERVER: ${{ secrets.COOLIFY_SERVER }}
      COOLIFY_API_KEY: ${{ secrets.COOLIFY_RO_API_KEY }}
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up pnpm and install dependencies
        uses: ./.github/actions/setup-pnpm

      - name: Build packages
        id: build
        run: pnpm build:dependencies

      - name: Smoke test staging backend
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          COOLIFY_APP_ID: ${{ secrets.COOLIFY_BACKEND_STAGING_ID }}
        run: ../../.github/scripts/config-smoke-test.sh

      - name: Smoke test production backend
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          COOLIFY_APP_ID: ${{ secrets.COOLIFY_BACKEND_PRODUCTION_ID }}
        run: ../../.github/scripts/config-smoke-test.sh

      - name: Smoke test staging update-monitor
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          COOLIFY_APP_ID: ${{ secrets.COOLIFY_UM_STAGING_ID }}
        run: ../../.github/scripts/config-smoke-test.sh

      - name: Smoke test production update-monitor
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          COOLIFY_APP_ID: ${{ secrets.COOLIFY_UM_PRODUCTION_ID }}
        run: ../../.github/scripts/config-smoke-test.sh

      - name: Smoke test staging tvs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          COOLIFY_APP_ID: ${{ secrets.COOLIFY_TVS_STAGING_ID }}
        run: ../../.github/scripts/config-smoke-test.sh

      - name: Smoke test production tvs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          COOLIFY_APP_ID: ${{ secrets.COOLIFY_TVS_PRODUCTION_ID }}
        run: ../../.github/scripts/config-smoke-test.sh
