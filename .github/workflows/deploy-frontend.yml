name: Deploy frontend 

concurrency:
  group: frontend-deployment
permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force deployment"
        required: true
        default: true
        type: boolean
      frontend-prod-enabled:
        description: "Deploy frontend prod"
        required: true
        default: true
        type: boolean
      frontend-staging-enabled:
        description: "Deploy frontend staging"
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main

jobs:
  affected:
    # Jobs below run whenever this one doesn't succeed, so a forced run or a
    # detection error still deploys.
    if: github.event.inputs.force != 'true'
    uses: ./.github/workflows/affected-packages.yml

  build:
    needs: affected
    if: ${{ always() && (needs.affected.result != 'success' || contains(fromJSON(needs.affected.outputs.packages || '[]'), '@l2beat/frontend')) }}
    uses: ./.github/workflows/build-docker-image.yml
    with:
      project: frontend
      dockerfile: packages/frontend/Dockerfile
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ secrets.TURBO_API_RW }}

  deploy-frontend-prod:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && ((github.event_name == 'workflow_dispatch' && github.event.inputs['frontend-prod-enabled'] == 'true') || (github.event_name != 'workflow_dispatch' && vars.DEPLOY_FRONTEND_PROD_ENABLED != 'false')) }}
    uses: ./.github/workflows/deploy-to-coolify.yml
    secrets:
      COOLIFY_SERVER: ${{ secrets.COOLIFY_SERVER }}
      COOLIFY_DEPLOY_API_KEY: ${{ secrets.COOLIFY_DEPLOY_API_KEY }}
      COOLIFY_UUID: ${{ secrets.COOLIFY_FRONTEND_PROD_ID }}

  deploy-frontend-staging:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && ((github.event_name == 'workflow_dispatch' && github.event.inputs['frontend-staging-enabled'] == 'true') || (github.event_name != 'workflow_dispatch' && vars.DEPLOY_FRONTEND_STAGING_ENABLED != 'false')) }}
    uses: ./.github/workflows/deploy-to-coolify.yml
    secrets:
      COOLIFY_SERVER: ${{ secrets.COOLIFY_SERVER }}
      COOLIFY_DEPLOY_API_KEY: ${{ secrets.COOLIFY_DEPLOY_API_KEY }}
      COOLIFY_UUID: ${{ secrets.COOLIFY_FRONTEND_STAGING_ID }}
