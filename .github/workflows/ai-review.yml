name: AI Review

on:
  issue_comment:
    types: [created]
  # Dev replay: labeling a PR `ai-review-test` re-runs the latest /ai-review
  # comment on it using this branch's workflow and code (issue_comment always
  # runs the version on main).
  pull_request:
    types: [labeled]

concurrency:
  group: ai-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Cheap pre-filter so non-member / non-command comments never spin a runner.
  # Must stay a loose superset of the unit-tested evaluateTrigger, which is the
  # authoritative gate (command syntax, membership, draft/fork/bot checks).
  gate:
    name: Gate
    if: >
      ${{
        (github.event_name == 'pull_request' && github.event.label.name == 'ai-review-test') ||
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '/ai-review') &&
        contains(fromJSON('["MEMBER","OWNER"]'), github.event.comment.author_association)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      comment_id: ${{ steps.event.outputs.comment_id }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      base_sha: ${{ steps.gate.outputs.base_sha }}
      pr_title: ${{ steps.pr.outputs.title }}
      pr_body: ${{ steps.pr.outputs.body }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --filter @l2beat/ai-review...
      - name: Build comment event
        id: event
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            cp "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/event.json"
          else
            COMMENT_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
              --jq '[.[] | select(.body | startswith("/ai-review"))] | last | .id // empty')
            if [ -z "$COMMENT_ID" ]; then
              echo "No /ai-review comment found on PR $PR_NUMBER"
              exit 1
            fi
            gh api "repos/$REPO/issues/comments/$COMMENT_ID" \
              | jq '{action: "created", comment: ., issue: {number: (.issue_url | split("/") | last | tonumber), pull_request: {url: .issue_url}}}' \
              > "$RUNNER_TEMP/event.json"
          fi
          echo "comment_id=$(jq .comment.id "$RUNNER_TEMP/event.json")" >> "$GITHUB_OUTPUT"
      - name: Fetch pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/$(jq .issue.number "$RUNNER_TEMP/event.json")" > "$RUNNER_TEMP/pr.json"
          echo "title=$(jq -r .title "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
          {
            echo "body<<AI_REVIEW_EOF"
            jq -r '.body // ""' "$RUNNER_TEMP/pr.json"
            echo "AI_REVIEW_EOF"
          } >> "$GITHUB_OUTPUT"
      - id: gate
        run: pnpm --filter @l2beat/ai-review gate
        env:
          EVENT_JSON_PATH: ${{ runner.temp }}/event.json
          PR_JSON_PATH: ${{ runner.temp }}/pr.json

  ack:
    name: Ack
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - name: React with eyes on the trigger comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ needs.gate.outputs.comment_id }}
          reactions: eyes

  review:
    name: Review (no write token)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Falls back to the stub engine when the Codex secret is not configured.
      ENGINE: ${{ secrets.CODEX_AUTH_JSON != '' && 'codex' || 'stub' }}
    outputs:
      engine: ${{ steps.review.outputs.engine }}
    steps:
      # Reviewer code runs from the trusted default-branch checkout; the PR head
      # is checked out into pr/ as inert input the agent inspects and probes.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          path: pr
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --filter @l2beat/ai-review...
      - run: pnpm --filter @l2beat/ai-review^... build
      - name: Install PR dependencies for agent probes
        working-directory: pr
        run: pnpm install
      - name: Compute diff
        working-directory: pr
        run: git diff "${{ needs.gate.outputs.base_sha }}...${{ needs.gate.outputs.head_sha }}" > "$RUNNER_TEMP/diff.patch"
      - name: Install Codex CLI
        if: env.ENGINE == 'codex'
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          npm install -g @openai/codex@0.149.1
          mkdir -p "$RUNNER_TEMP/codex-home"
          printf '%s' "$CODEX_AUTH_JSON" > "$RUNNER_TEMP/codex-home/auth.json"
      - id: review
        run: pnpm --filter @l2beat/ai-review review
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          CODEX_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          FIND_MAX_TOKENS: ${{ vars.AI_REVIEW_FIND_MAX_TOKENS || 400000 }}
          FIND_TIMEOUT_MS: 600000
          REVIEW_CWD: ${{ github.workspace }}/pr
          DIFF_PATH: ${{ runner.temp }}/diff.patch
          REVIEW_OUTPUT_PATH: ${{ runner.temp }}/review.json
          PR_TITLE: ${{ needs.gate.outputs.pr_title }}
          PR_BODY: ${{ needs.gate.outputs.pr_body }}
      - uses: actions/upload-artifact@v7
        with:
          name: ai-review-output
          path: |
            ${{ runner.temp }}/review.json
            ${{ runner.temp }}/diff.patch

  post:
    name: Post
    # ack is included so the final reaction is always written after the eyes.
    needs: [gate, ack, review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --filter @l2beat/ai-review...
      - uses: actions/download-artifact@v7
        with:
          name: ai-review-output
          path: ${{ runner.temp }}
      - run: pnpm --filter @l2beat/ai-review^... build
      - name: Validate and build review payload
        run: pnpm --filter @l2beat/ai-review post
        env:
          REVIEW_OUTPUT_PATH: ${{ runner.temp }}/review.json
          DIFF_PATH: ${{ runner.temp }}/diff.patch
          REVIEW_PAYLOAD_PATH: ${{ runner.temp }}/review-payload.json
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          LESSONS_VERSION: none
          ENGINE: ${{ needs.review.outputs.engine }}
      - name: Post review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pulls/${{ needs.gate.outputs.pr_number }}/reviews" --input "$RUNNER_TEMP/review-payload.json" --jq .html_url
      - name: Mark trigger comment as done
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ needs.gate.outputs.comment_id }}
          reactions: '+1'
          reactions-edit-mode: replace
