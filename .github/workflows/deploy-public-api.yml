name: Deploy public-api

concurrency:
  group: public-api-deployment
permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force deployment"
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main

jobs:
  affected:
    # Jobs below run whenever this one doesn't succeed, so a forced run or a
    # detection error still deploys.
    if: github.event.inputs.force != 'true'
    uses: ./.github/workflows/affected-packages.yml

  build:
    needs: affected
    if: ${{ always() && (needs.affected.result != 'success' || contains(fromJSON(needs.affected.outputs.packages || '[]'), '@l2beat/public-api')) }}
    uses: ./.github/workflows/build-docker-image.yml
    with:
      project: public-api
      dockerfile: packages/public-api/Dockerfile
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ secrets.TURBO_API_RW }}

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: ./.github/workflows/deploy-to-coolify.yml
    secrets:
      COOLIFY_SERVER: ${{ secrets.COOLIFY_SERVER }}
      COOLIFY_DEPLOY_API_KEY: ${{ secrets.COOLIFY_DEPLOY_API_KEY }}
      COOLIFY_UUID: ${{ secrets.COOLIFY_PUBLIC_API_ID }}
