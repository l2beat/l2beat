name: Deploy crops-api

concurrency:
  group: crops-api-deployment-${{ github.event.inputs.environment || 'production' }}
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Cloudflare environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      force:
        description: "Force deployment"
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main

jobs:
  affected:
    # Jobs below run whenever this one doesn't succeed, so a forced run or a
    # detection error still deploys.
    if: github.event.inputs.force != 'true'
    uses: ./.github/workflows/affected-packages.yml

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    needs: affected
    if: ${{ always() && (needs.affected.result != 'success' || contains(fromJSON(needs.affected.outputs.packages || '[]'), '@l2beat/crops-api')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ secrets.TURBO_API_RW }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up pnpm and install dependencies
        uses: ./.github/actions/setup-pnpm

      - name: Build dependencies
        run: pnpm build:dependencies:crops-api

      - name: Generate site
        run: pnpm --filter @l2beat/crops-api generate

      - name: Deploy with Wrangler
        run: pnpm --filter @l2beat/crops-api wrangler deploy --env "$ENVIRONMENT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
