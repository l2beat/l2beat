name: Check for Changes

on:
  workflow_call:
    inputs:
      force:
        description: "Skip check and always pass"
        required: false
        type: boolean
        default: false
      package:
        description: "Package to check (e.g., @l2beat/backend)"
        required: true
        type: string
    outputs:
      should_deploy:
        description: "Bool whether deployment should run"
        value: ${{ jobs.check-changes.outputs.should_deploy }}

permissions:
  contents: read

jobs:
  check-changes:
    name: Check for changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      # fetch-depth 2 so the action can diff HEAD against the previous commit.
      - name: Check out code
        if: ${{ !inputs.force }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: List affected packages
        if: ${{ !inputs.force }}
        id: affected
        uses: ./.github/actions/affected-packages

      - name: Check if package changed
        id: check
        env:
          FORCE: ${{ inputs.force }}
          PACKAGE: ${{ inputs.package }}
          AFFECTED: ${{ steps.affected.outputs.packages }}
        run: |
          if [[ "$FORCE" == "true" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "✓ Forced deployment"
          elif jq -e --arg p "$PACKAGE" 'index($p) != null' <<< "$AFFECTED" > /dev/null; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "✓ $PACKAGE package changed, will deploy"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "✗ $PACKAGE package unchanged, skipping deployment"
          fi
