name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

jobs:
  build-backend:
    name: Build backend container image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - parallel:
          - name: Check out code
            uses: actions/checkout@v6
          - name: Set up Docker.io mirror
            uses: docker/setup-buildx-action@v4
            with:
              cleanup: false
              buildkitd-config-inline: |
                [registry."docker.io"]
                  mirrors = ["mirror.gcr.io"]
      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          file: packages/backend/Dockerfile
          build-args: |
            TURBO_TEAM=${{ vars.TURBO_TEAM }}
          secrets: |
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
            TURBO_API=${{ secrets.TURBO_API_RO }}

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ secrets.TURBO_API_RO }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up pnpm and install dependencies
        uses: ./.github/actions/setup-pnpm

      - name: Build mocked frontend
        run: pnpm build:frontend-ci
        env:
          MOCK: true

      # We can get rid of it later, now it's used
      # so we can more easily inspect occasional
      # longer frontend build times
      - name: Preserve frontend build summary
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build-summary
          path: .turbo/runs

  build-protocolbeat:
    name: Build protocolbeat
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ secrets.TURBO_API_RO }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up pnpm and install dependencies
        uses: ./.github/actions/setup-pnpm

      - name: Build protocolbeat
        run: pnpm build:protocolbeat

  build-tools:
    name: Build tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ secrets.TURBO_API_RO }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        
      - name: Set up pnpm and install dependencies
        uses: ./.github/actions/setup-pnpm

      - name: Build tools
        run: pnpm build:tools

  build-uops-dashboard:
    name: Build uops-dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ secrets.TURBO_API_RO }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        
      - name: Set up pnpm and install dependencies
        uses: ./.github/actions/setup-pnpm

      - name: Build tx-decoder
        run: pnpm build:uops-dashboard

  build-token-backend:
    name: Build token-backend container image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - parallel:
          - name: Check out code
            uses: actions/checkout@v6
          - name: Set up Docker.io mirror
            uses: docker/setup-buildx-action@v4
            with:
              cleanup: false
              buildkitd-config-inline: |
                [registry."docker.io"]
                  mirrors = ["mirror.gcr.io"]
      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          file: packages/token-backend/Dockerfile
          build-args: |
            TURBO_TEAM=${{ vars.TURBO_TEAM }}
          secrets: |
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
            TURBO_API=${{ secrets.TURBO_API_RO }}

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ secrets.TURBO_API_RO }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up pnpm and install dependencies
        uses: ./.github/actions/setup-pnpm

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ secrets.TURBO_API_RO }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
      CONFIG_ALCHEMY_API_KEY: ${{ secrets.CONFIG_ALCHEMY_API_KEY }}
    steps:
      # A background step rather than a service container, so the image pull
      # overlaps with setup instead of blocking the first step
      - name: Start Postgres
        id: postgres
        background: true
        timeout-minutes: 3
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres mirror.gcr.io/postgres:18-alpine
          # TCP, because the init-time server only listens on the unix socket
          until docker exec postgres pg_isready -h 127.0.0.1; do sleep 1; done

      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up pnpm and install dependencies
        uses: ./.github/actions/setup-pnpm

      - name: Wait for Postgres
        wait: postgres

      - name: Test
        run: pnpm run test --reporter min

  test-e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ secrets.TURBO_API_RO }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up pnpm and install dependencies
        uses: ./.github/actions/setup-pnpm

      - parallel:
          - name: Set up Playwright
            uses: ./.github/actions/setup-playwright
            with:
              package-dir: packages/frontend

          - name: Build dependencies
            run: pnpm build:dependencies:frontend

      - name: Run e2e tests
        run: |
          cd packages/frontend
          pnpm test:e2e

  test-e2e-discoui:
    name: DiscoUI E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ secrets.TURBO_API_RO }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up pnpm and install dependencies
        uses: ./.github/actions/setup-pnpm

      - parallel:
          - name: Set up Playwright
            uses: ./.github/actions/setup-playwright
            with:
              package-dir: packages/protocolbeat

          - name: Build dependencies
            run: pnpm build:dependencies:l2b

      # Independent: the backend suite listens on a random port, the page
      # suite on its own dev server
      - parallel:
          - name: Run backend e2e tests
            working-directory: packages/l2b
            run: pnpm test:e2e

          - name: Run page e2e tests
            working-directory: packages/protocolbeat
            run: pnpm test:e2e

  biome:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Setup Biome CLI
        uses: biomejs/setup-biome@v2
        with:
          version: 2.3.8

      - name: Run Biome
        run: biome ci

  test-gha-timeouts:
    name: Test if all GH Action jobs have timeout defined
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Setup yq
        uses: dcarbone/install-yq-action@v1
      - name: Test all workflow manifests
        run: |
          declare -a failed_files

          echo "Scanning files for timeout definitions"
          for file in .github/workflows/*.y*ml; do
            out=$(yq -r '
              (.jobs // {})
              | to_entries[]
              | select(.value | has("uses") | not)
              | select(.value | has("timeout-minutes") | not)
              | .key
            ' "$file")
            echo "$file: ${out:-"OK"}"
            if [[ -n "$out" ]]; then
              failed_files+=($file)
            fi
          done
          if [[ ${#failed_files[@]} -gt 0 ]]; then
            echo
            echo "Some workflows are missing timeout definition. Files failing validation:"
            echo "${failed_files[@]}"
            exit 1
          fi
