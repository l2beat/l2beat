name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

# Turbo's remote cache: main runs every task fresh and saves the results, the
# merge queue runs every task fresh too, so nothing reaches main on a cached
# result, and pull requests replay the results of the tasks whose inputs
# match main's. Only main can write, so a pull request cannot plant a result

jobs:
  build-backend:
    name: Build backend container image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - parallel:
          - name: Check out code
            uses: actions/checkout@v6
          - name: Set up Docker.io mirror
            uses: docker/setup-buildx-action@v4
            with:
              cleanup: false
              buildkitd-config-inline: |
                [registry."docker.io"]
                  mirrors = ["mirror.gcr.io"]
      - name: Check whether the change reaches this job
        id: affected
        uses: ./.github/actions/affected
        with:
          packages: '@l2beat/backend'

      - name: Build container
        if: ${{ steps.affected.outputs.affected == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          file: packages/backend/Dockerfile
          build-args: |
            TURBO_TEAM=${{ vars.TURBO_TEAM }}
          secrets: |
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
            TURBO_API=${{ secrets.TURBO_API_RO }}

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ github.event_name == 'push' && secrets.TURBO_API_RW || secrets.TURBO_API_RO }}
      TURBO_FORCE: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Check whether the change reaches this job
        id: affected
        uses: ./.github/actions/affected
        with:
          packages: '@l2beat/frontend'

      - name: Set up pnpm and install dependencies
        if: ${{ steps.affected.outputs.affected == 'true' }}
        uses: ./.github/actions/setup-pnpm

      - name: Build mocked frontend
        if: ${{ steps.affected.outputs.affected == 'true' }}
        run: pnpm build:frontend-ci
        env:
          MOCK: true

      # We can get rid of it later, now it's used
      # so we can more easily inspect occasional
      # longer frontend build times
      - name: Preserve frontend build summary
        if: ${{ steps.affected.outputs.affected == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build-summary
          path: .turbo/runs

  build-discoui:
    name: Build discoui
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ github.event_name == 'push' && secrets.TURBO_API_RW || secrets.TURBO_API_RO }}
      TURBO_FORCE: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Check whether the change reaches this job
        id: affected
        uses: ./.github/actions/affected
        with:
          packages: '@l2beat/discoui'

      - name: Set up pnpm and install dependencies
        if: ${{ steps.affected.outputs.affected == 'true' }}
        uses: ./.github/actions/setup-pnpm

      - name: Build discoui
        if: ${{ steps.affected.outputs.affected == 'true' }}
        run: pnpm build:discoui

  build-tools:
    name: Build tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ github.event_name == 'push' && secrets.TURBO_API_RW || secrets.TURBO_API_RO }}
      TURBO_FORCE: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Check whether the change reaches this job
        id: affected
        uses: ./.github/actions/affected
        with:
          packages: '@l2beat/tools'

      - name: Set up pnpm and install dependencies
        if: ${{ steps.affected.outputs.affected == 'true' }}
        uses: ./.github/actions/setup-pnpm

      - name: Build tools
        if: ${{ steps.affected.outputs.affected == 'true' }}
        run: pnpm build:tools

  build-token-backend:
    name: Build token-backend container image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - parallel:
          - name: Check out code
            uses: actions/checkout@v6
          - name: Set up Docker.io mirror
            uses: docker/setup-buildx-action@v4
            with:
              cleanup: false
              buildkitd-config-inline: |
                [registry."docker.io"]
                  mirrors = ["mirror.gcr.io"]
      - name: Check whether the change reaches this job
        id: affected
        uses: ./.github/actions/affected
        with:
          packages: '@l2beat/token-backend'

      - name: Build container
        if: ${{ steps.affected.outputs.affected == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          file: packages/token-backend/Dockerfile
          build-args: |
            TURBO_TEAM=${{ vars.TURBO_TEAM }}
          secrets: |
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
            TURBO_API=${{ secrets.TURBO_API_RO }}

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ github.event_name == 'push' && secrets.TURBO_API_RW || secrets.TURBO_API_RO }}
      TURBO_FORCE: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up pnpm and install dependencies
        uses: ./.github/actions/setup-pnpm

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ github.event_name == 'push' && secrets.TURBO_API_RW || secrets.TURBO_API_RO }}
      TURBO_FORCE: ${{ github.event_name != 'pull_request' }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
      CONFIG_ALCHEMY_API_KEY: ${{ secrets.CONFIG_ALCHEMY_API_KEY }}
    steps:
      # A background step rather than a service container, so the image pull
      # overlaps with setup instead of blocking the first step
      - name: Start Postgres
        id: postgres
        background: true
        timeout-minutes: 3
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres mirror.gcr.io/postgres:18-alpine
          # TCP, because the init-time server only listens on the unix socket
          until docker exec postgres pg_isready -h 127.0.0.1; do sleep 1; done

      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up pnpm and install dependencies
        uses: ./.github/actions/setup-pnpm

      - name: Wait for Postgres
        wait: postgres

      - name: Test
        run: pnpm run test --reporter min

  # A runner's four CPUs limit how many tests can run at once without slowing
  # each other down, so the suites are spread over runners instead
  # (see packages/frontend/e2e/README.md)
  test-e2e-shard:
    name: E2E tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Chromium 1/2
            args: --project chromium --shard 1/2
          - name: Chromium 2/2
            args: --project chromium --shard 2/2
          # Ratchets, one at a time on a runner of their own. The two perf
          # runners split the project by folder, at about 50 s of tests each:
          # 2/2 takes the folders in PERF_2, 1/2 takes everything else, so a
          # new folder lands on 1/2 and none is left out
          - name: perf 1/2
            args: --project perf --no-deps --grep-invert "$PERF_2"
          - name: perf 2/2
            args: --project perf --no-deps --grep "$PERF_2"
            webkit: true
          - name: blobs perf
            args: --project "blobs perf" --no-deps
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ github.event_name == 'push' && secrets.TURBO_API_RW || secrets.TURBO_API_RO }}
      TURBO_FORCE: ${{ github.event_name != 'pull_request' }}
      PERF_2: token-graph-perf/|blobs-webkit-perf/
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Check whether the change reaches this job
        id: affected
        uses: ./.github/actions/affected
        with:
          packages: '@l2beat/frontend'

      # WebKit's system libraries need nothing from pnpm, so they install
      # alongside setup and the build instead of after them. Main caches a
      # snapshot of the installed files, which restores in seconds; dpkg
      # takes 25-30 s even from cached .deb files, which stay as the
      # fallback for a new runner image
      - name: Read runner image and Playwright version
        if: steps.affected.outputs.affected == 'true' && matrix.webkit
        id: image
        run: |
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "playwright=$(grep -oP '^  playwright@\K[0-9.]+(?=:)' pnpm-lock.yaml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Restore WebKit's system libraries
        if: steps.affected.outputs.affected == 'true' && matrix.webkit
        id: webkit-snapshot
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/webkit-libs
          key: webkit-libs-v2-${{ steps.image.outputs.version }}-${{ steps.image.outputs.playwright }}

      - name: Restore WebKit's system packages
        if: steps.affected.outputs.affected == 'true' && matrix.webkit && steps.webkit-snapshot.outputs.cache-hit != 'true'
        id: webkit-packages
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/webkit-packages
          key: webkit-packages-${{ steps.image.outputs.version }}-${{ steps.image.outputs.playwright }}
          restore-keys: webkit-packages-${{ steps.image.outputs.os }}-

      - name: Install WebKit's system libraries
        if: steps.affected.outputs.affected == 'true' && matrix.webkit
        id: webkit-libs
        background: true
        timeout-minutes: 3
        env:
          PLAYWRIGHT_VERSION: ${{ steps.image.outputs.playwright }}
        run: .github/scripts/install-webkit-libs.sh

      - name: Set up pnpm and install dependencies
        if: ${{ steps.affected.outputs.affected == 'true' }}
        uses: ./.github/actions/setup-pnpm

      - parallel:
          - name: Set up Playwright
            if: ${{ steps.affected.outputs.affected == 'true' }}
            uses: ./.github/actions/setup-playwright
            with:
              package-dir: packages/frontend
              webkit: ${{ matrix.webkit || false }}

          - name: Build frontend
            if: ${{ steps.affected.outputs.affected == 'true' }}
            run: |
              pnpm build:dependencies:frontend
              pnpm --dir packages/frontend build

      # A wait step takes no `if`; on runners without WebKit it waits for a
      # skipped step and goes straight on
      - name: Wait for WebKit's system libraries
        wait: webkit-libs

      - name: Run e2e tests
        if: ${{ steps.affected.outputs.affected == 'true' }}
        working-directory: packages/frontend
        run: pnpm exec playwright test ${{ matrix.args }}

      # Only main saves the cache, as with pnpm's. autoclean drops the
      # versions the mirror no longer serves, so a partial restore does not
      # pile them up
      - name: Snapshot WebKit's system libraries
        if: steps.affected.outputs.affected == 'true' && matrix.webkit && github.ref == 'refs/heads/main' && steps.webkit-snapshot.outputs.cache-hit != 'true'
        run: .github/scripts/snapshot-webkit-libs.sh

      - name: Save WebKit's system libraries
        if: steps.affected.outputs.affected == 'true' && matrix.webkit && github.ref == 'refs/heads/main' && steps.webkit-snapshot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/webkit-libs
          key: ${{ steps.webkit-snapshot.outputs.cache-primary-key }}

      - name: Collect WebKit's system packages
        if: steps.affected.outputs.affected == 'true' && matrix.webkit && github.ref == 'refs/heads/main' && steps.webkit-snapshot.outputs.cache-hit != 'true' && steps.webkit-packages.outputs.cache-hit != 'true'
        run: |
          sudo apt-get autoclean
          rm -rf ~/.cache/webkit-packages
          mkdir -p ~/.cache/webkit-packages
          cp /var/cache/apt/archives/*.deb ~/.cache/webkit-packages

      - name: Save WebKit's system packages
        if: steps.affected.outputs.affected == 'true' && matrix.webkit && github.ref == 'refs/heads/main' && steps.webkit-snapshot.outputs.cache-hit != 'true' && steps.webkit-packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/webkit-packages
          key: ${{ steps.webkit-packages.outputs.cache-primary-key }}

  # Branch protection requires this check; it passes once every shard has
  test-e2e:
    name: E2E tests
    needs: test-e2e-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that every shard passed
        run: test "${{ needs.test-e2e-shard.result }}" = success

  # The page suite is the long one, so it is split over two runners; the
  # backend suite, 20 s on its own, follows the second half
  test-e2e-discoui:
    name: DiscoUI E2E tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ github.event_name == 'push' && secrets.TURBO_API_RW || secrets.TURBO_API_RO }}
      TURBO_FORCE: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Check whether the change reaches this job
        id: affected
        uses: ./.github/actions/affected
        with:
          packages: '@l2beat/discoui @l2beat/l2b'

      - name: Set up pnpm and install dependencies
        if: ${{ steps.affected.outputs.affected == 'true' }}
        uses: ./.github/actions/setup-pnpm

      - parallel:
          - name: Set up Playwright
            if: ${{ steps.affected.outputs.affected == 'true' }}
            uses: ./.github/actions/setup-playwright
            with:
              package-dir: packages/discoui

          - name: Build dependencies
            if: ${{ steps.affected.outputs.affected == 'true' }}
            run: pnpm build:dependencies:l2b

      - name: Run page e2e tests
        if: ${{ steps.affected.outputs.affected == 'true' }}
        working-directory: packages/discoui
        run: pnpm test:e2e --shard ${{ matrix.shard }}/2

      - name: Run backend e2e tests
        if: steps.affected.outputs.affected == 'true' && matrix.shard == 2
        working-directory: packages/l2b
        run: pnpm test:e2e

  biome:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Setup Biome CLI
        uses: biomejs/setup-biome@v2
        with:
          version: 2.3.8

      - name: Run Biome
        run: biome ci

  test-gha-timeouts:
    name: Test if all GH Action jobs have timeout defined
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Setup yq
        uses: dcarbone/install-yq-action@v1
      - name: Test all workflow manifests
        run: |
          declare -a failed_files

          echo "Scanning files for timeout definitions"
          for file in .github/workflows/*.y*ml; do
            out=$(yq -r '
              (.jobs // {})
              | to_entries[]
              | select(.value | has("uses") | not)
              | select(.value | has("timeout-minutes") | not)
              | .key
            ' "$file")
            echo "$file: ${out:-"OK"}"
            if [[ -n "$out" ]]; then
              failed_files+=($file)
            fi
          done
          if [[ ${#failed_files[@]} -gt 0 ]]; then
            echo
            echo "Some workflows are missing timeout definition. Files failing validation:"
            echo "${failed_files[@]}"
            exit 1
          fi
