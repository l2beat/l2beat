name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

jobs:
  build-backend:
    name: Build backend container image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - parallel:
          - name: Check out code
            uses: actions/checkout@v6
          - name: Set up Docker.io mirror
            uses: docker/setup-buildx-action@v4
            with:
              cleanup: false
              buildkitd-config-inline: |
                [registry."docker.io"]
                  mirrors = ["mirror.gcr.io"]
      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          file: packages/backend/Dockerfile
          build-args: |
            TURBO_TEAM=${{ vars.TURBO_TEAM }}
          secrets: |
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
            TURBO_API=${{ secrets.TURBO_API_RO }}

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ secrets.TURBO_API_RO }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up pnpm and install dependencies
        uses: ./.github/actions/setup-pnpm

      - name: Build mocked frontend
        run: pnpm build:frontend-ci
        env:
          MOCK: true

      # We can get rid of it later, now it's used
      # so we can more easily inspect occasional
      # longer frontend build times
      - name: Preserve frontend build summary
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build-summary
          path: .turbo/runs

  build-protocolbeat:
    name: Build protocolbeat
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ secrets.TURBO_API_RO }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up pnpm and install dependencies
        uses: ./.github/actions/setup-pnpm

      - name: Build protocolbeat
        run: pnpm build:protocolbeat

  build-tools:
    name: Build tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ secrets.TURBO_API_RO }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        
      - name: Set up pnpm and install dependencies
        uses: ./.github/actions/setup-pnpm

      - name: Build tools
        run: pnpm build:tools

  build-uops-dashboard:
    name: Build uops-dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ secrets.TURBO_API_RO }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        
      - name: Set up pnpm and install dependencies
        uses: ./.github/actions/setup-pnpm

      - name: Build tx-decoder
        run: pnpm build:uops-dashboard

  build-token-backend:
    name: Build token-backend container image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - parallel:
          - name: Check out code
            uses: actions/checkout@v6
          - name: Set up Docker.io mirror
            uses: docker/setup-buildx-action@v4
            with:
              cleanup: false
              buildkitd-config-inline: |
                [registry."docker.io"]
                  mirrors = ["mirror.gcr.io"]
      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          file: packages/token-backend/Dockerfile
          build-args: |
            TURBO_TEAM=${{ vars.TURBO_TEAM }}
          secrets: |
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
            TURBO_API=${{ secrets.TURBO_API_RO }}

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ secrets.TURBO_API_RO }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up pnpm and install dependencies
        uses: ./.github/actions/setup-pnpm

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ secrets.TURBO_API_RO }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
      CONFIG_ALCHEMY_API_KEY: ${{ secrets.CONFIG_ALCHEMY_API_KEY }}
    steps:
      # A background step rather than a service container, so the image pull
      # overlaps with setup instead of blocking the first step
      - name: Start Postgres
        id: postgres
        background: true
        timeout-minutes: 3
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres mirror.gcr.io/postgres:18-alpine
          # TCP, because the init-time server only listens on the unix socket
          until docker exec postgres pg_isready -h 127.0.0.1; do sleep 1; done

      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up pnpm and install dependencies
        uses: ./.github/actions/setup-pnpm

      - name: Wait for Postgres
        wait: postgres

      - name: Test
        run: pnpm run test --reporter min

  # A runner's four CPUs limit how many tests can run at once without slowing
  # each other down, so the suites are spread over runners instead
  # (see packages/frontend/e2e/README.md)
  test-e2e-shard:
    name: E2E tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Chromium 1/2
            args: --project chromium --shard 1/2
          - name: Chromium 2/2
            args: --project chromium --shard 2/2
          # Ratchets, one at a time on a runner of their own
          - name: perf
            args: --project perf --no-deps
            webkit: true
          - name: blobs perf 1/3
            args: --project "blobs perf" --no-deps --shard 1/3
          - name: blobs perf 2/3
            args: --project "blobs perf" --no-deps --shard 2/3
          - name: blobs perf 3/3
            args: --project "blobs perf" --no-deps --shard 3/3
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ secrets.TURBO_API_RO }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up pnpm and install dependencies
        uses: ./.github/actions/setup-pnpm

      - parallel:
          - name: Set up Playwright
            uses: ./.github/actions/setup-playwright
            with:
              package-dir: packages/frontend
              webkit: ${{ matrix.webkit || false }}

          - name: Build frontend
            run: |
              pnpm build:dependencies:frontend
              pnpm --dir packages/frontend build

      - name: Run e2e tests
        working-directory: packages/frontend
        run: pnpm exec playwright test ${{ matrix.args }}

  # Branch protection requires this check; it passes once every shard has
  test-e2e:
    name: E2E tests
    needs: test-e2e-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that every shard passed
        run: test "${{ needs.test-e2e-shard.result }}" = success

  # The page suite is the long one, so it is split over two runners; the
  # backend suite, 20 s on its own, follows the second half
  test-e2e-discoui:
    name: DiscoUI E2E tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ secrets.TURBO_API_RO }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up pnpm and install dependencies
        uses: ./.github/actions/setup-pnpm

      - parallel:
          - name: Set up Playwright
            uses: ./.github/actions/setup-playwright
            with:
              package-dir: packages/protocolbeat

          - name: Build dependencies
            run: pnpm build:dependencies:l2b

      - name: Run page e2e tests
        working-directory: packages/protocolbeat
        run: pnpm test:e2e --shard ${{ matrix.shard }}/2

      - name: Run backend e2e tests
        if: matrix.shard == 2
        working-directory: packages/l2b
        run: pnpm test:e2e

  biome:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Setup Biome CLI
        uses: biomejs/setup-biome@v2
        with:
          version: 2.3.8

      - name: Run Biome
        run: biome ci

  test-gha-timeouts:
    name: Test if all GH Action jobs have timeout defined
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Setup yq
        uses: dcarbone/install-yq-action@v1
      - name: Test all workflow manifests
        run: |
          declare -a failed_files

          echo "Scanning files for timeout definitions"
          for file in .github/workflows/*.y*ml; do
            out=$(yq -r '
              (.jobs // {})
              | to_entries[]
              | select(.value | has("uses") | not)
              | select(.value | has("timeout-minutes") | not)
              | .key
            ' "$file")
            echo "$file: ${out:-"OK"}"
            if [[ -n "$out" ]]; then
              failed_files+=($file)
            fi
          done
          if [[ ${#failed_files[@]} -gt 0 ]]; then
            echo
            echo "Some workflows are missing timeout definition. Files failing validation:"
            echo "${failed_files[@]}"
            exit 1
          fi
