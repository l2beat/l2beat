name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      project:
        description: "Project name (e.g., frontend, backend, disco-ui)"
        required: true
        type: string
      dockerfile:
        description: "Dockerfile path (e.g., packages/frontend/Dockerfile)"
        required: true
        type: string
      extra_build_args:
        description: "Additional Docker build args passed to docker/build-push-action"
        required: false
        default: ""
        type: string
    secrets:
      TURBO_TOKEN:
        required: true
      TURBO_TEAM:
        required: false
      TURBO_API:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push ${{ inputs.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_API: ${{ secrets.TURBO_API }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - parallel:
          - name: Check out code
            uses: actions/checkout@v6

          - name: Set up Docker.io mirror
            uses: docker/setup-buildx-action@v4
            with:
              cleanup: false
              buildkitd-config-inline: |
                [registry."docker.io"]
                  mirrors = ["mirror.gcr.io"]

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every Coolify app pulls `:latest`, so a build from any other branch
      # would replace what staging and prod run on their next deploy.
      - name: Warn that a branch build is not deployed
        if: github.ref != 'refs/heads/main'
        run: echo "::warning title=Branch build not deployed::Only main builds get the latest tag, which every Coolify app pulls. This image is tagged ${{ github.sha }} only, so deploys in this run redeploy main's image."

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ inputs.project }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/{1}:latest', github.repository, inputs.project) || '' }}
          build-args: |
            TURBO_TEAM=${{ secrets.TURBO_TEAM }}
            ${{ inputs.extra_build_args }}
          secrets: |
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
            TURBO_API=${{ secrets.TURBO_API }}
          no-cache: true
