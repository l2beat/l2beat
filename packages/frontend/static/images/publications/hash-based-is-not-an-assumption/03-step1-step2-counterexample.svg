<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 318" width="720" height="318" role="img" aria-labelledby="t3 d3">
  <title id="t3">The STEP1 and STEP2 collision-resistant counterexample</title>
  <desc id="d3">Two-lane diagram of f(tag, x) separated by STEP1 not equal to STEP2 preserving collision resistance and one-wayness above, and the Winternitz forgery stepping backwards from position 2 (STEP2, z) to position 1 (STEP1, z) below.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
      .node { font-size: 12px; font-weight: 600; }
      .sub { font-size: 10.5px; fill: #71717a; }
      .f { font-size: 12px; font-style: italic; font-weight: 600; }
      .tag { font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; }
    </style>
    <marker id="k-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="k-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="k-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="k-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="719" height="317" rx="12" fill="#ffffff" stroke="#e4e4e7"/>

  <!-- TOP: TWO LANES -->
  <text x="28" y="30" class="sans tag" fill="#1d4ed8">NORMAL LANE (tag ≠ STEP1)</text>
  <rect x="28" y="42" width="108" height="36" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="82" y="64" text-anchor="middle" class="mono node" fill="#334155">(tag, x)</text>
  <line x1="140" y1="60" x2="174" y2="60" stroke="#2563eb" stroke-width="1.8" marker-end="url(#k-blue)"/>
  <text x="157" y="52" text-anchor="middle" class="sans f" fill="#2563eb">f</text>
  <rect x="180" y="42" width="166" height="36" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="263" y="64" text-anchor="middle" class="mono node" fill="#1e3a8a">(STEP1, H(tag‖x))</text>

  <!-- Vertical green barrier -->
  <line x1="366" y1="22" x2="366" y2="96" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="308" y="88" width="116" height="20" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="366" y="101.5" text-anchor="middle" class="sans" font-size="9.5" font-weight="700" fill="#065f46">STEP1 ≠ STEP2</text>

  <text x="390" y="30" class="sans tag" fill="#b45309">SHORTCUT LANE (tag = STEP1)</text>
  <rect x="390" y="42" width="128" height="36" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="454" y="64" text-anchor="middle" class="mono node" fill="#92400e">(STEP1, x)</text>
  <line x1="522" y1="60" x2="556" y2="60" stroke="#d97706" stroke-width="1.8" marker-end="url(#k-amber)"/>
  <text x="539" y="52" text-anchor="middle" class="sans f" fill="#d97706">f</text>
  <rect x="562" y="42" width="130" height="36" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="627" y="64" text-anchor="middle" class="mono node" fill="#991b1b">(STEP2, x)</text>

  <!-- Horizontal divider -->
  <line x1="28" y1="126" x2="692" y2="126" stroke="#e4e4e7" stroke-width="1"/>

  <!-- BOTTOM: WINTERNITZ FORGERY -->
  <text x="28" y="150" class="sans tag" fill="#991b1b">WINTERNITZ FORGERY (STEP BACK FROM POSITION 2)</text>

  <!-- Real chain row -->
  <rect x="28" y="168" width="108" height="42" rx="8" fill="#f4f4f5" stroke="#a1a1aa" stroke-dasharray="4 3"/>
  <text x="82" y="187" text-anchor="middle" class="mono node" fill="#52525b">v₀</text>
  <text x="82" y="202" text-anchor="middle" class="sans sub">pos 0 · secret</text>

  <line x1="140" y1="189" x2="176" y2="189" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#k-slate)"/>
  <text x="158" y="181" text-anchor="middle" class="sans f" fill="#71717a">f</text>

  <rect x="182" y="168" width="144" height="42" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="254" y="187" text-anchor="middle" class="mono node" fill="#1e3a8a">(STEP1, z)</text>
  <text x="254" y="202" text-anchor="middle" class="sans" font-size="10" fill="#1d4ed8">pos 1 · v₁</text>

  <line x1="330" y1="189" x2="374" y2="189" stroke="#d97706" stroke-width="1.8" marker-end="url(#k-amber)"/>
  <text x="352" y="181" text-anchor="middle" class="sans f" fill="#d97706">f</text>

  <rect x="380" y="168" width="150" height="42" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.2"/>
  <text x="455" y="187" text-anchor="middle" class="mono node" fill="#115e59">(STEP2, z)</text>
  <text x="455" y="202" text-anchor="middle" class="sans" font-size="10" font-weight="700" fill="#0f766e">pos 2 · v₂ revealed</text>

  <line x1="534" y1="189" x2="596" y2="189" stroke="#2563eb" stroke-width="1.8" marker-end="url(#k-blue)"/>
  <text x="565" y="180" text-anchor="middle" class="mono" font-size="11" fill="#1d4ed8">f<tspan dy="-4" font-size="8.5">w−3</tspan></text>

  <rect x="602" y="168" width="90" height="42" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="647" y="193" text-anchor="middle" class="mono node" fill="#1e3a8a">pk₁</text>

  <!-- Forged row: backward step from v2 to forged sigma_1* -->
  <rect x="182" y="248" width="144" height="42" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="254" y="267" text-anchor="middle" class="mono node" fill="#991b1b">(STEP1, z)</text>
  <text x="254" y="282" text-anchor="middle" class="sans" font-size="10" font-weight="700" fill="#b91c1c">forged σ₁* (= v₁)</text>

  <!-- Red backward curve from v2 bottom to forged sigma_1* right -->
  <path d="M 455 212 C 455 256, 396 269, 332 269" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="5 3" marker-end="url(#k-red)"/>
  <text x="470" y="262" class="sans" font-size="11.5" font-weight="700" fill="#dc2626">Free step back</text>
  <text x="470" y="279" class="sans sub">swap STEP2 → STEP1, keep z</text>
</svg>
