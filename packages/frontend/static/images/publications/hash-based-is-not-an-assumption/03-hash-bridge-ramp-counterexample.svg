<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 318" width="720" height="318" role="img" aria-labelledby="t3 d3">
  <title id="t3">The HASH, BRIDGE, and RAMP counterexample</title>
  <desc id="d3">Diagram showing the two lanes of f(tag, r) separated by the BRIDGE versus HASH barrier above, and the two-step Winternitz forgery merging onto the real chain below.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
      .node { font-size: 12px; font-weight: 600; }
      .sub { font-size: 10.5px; fill: #71717a; }
      .f { font-size: 12px; font-style: italic; font-weight: 600; }
      .tag { font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; }
    </style>
    <marker id="k-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="k-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="k-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="k-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="719" height="317" rx="12" fill="#ffffff" stroke="#e4e4e7"/>

  <!-- TOP: TWO LANES (SIDE BY SIDE!) -->
  <text x="32" y="30" class="sans tag" fill="#1d4ed8">NORMAL LANE (tag ≠ RAMP)</text>
  <rect x="32" y="42" width="136" height="36" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="100" y="64" text-anchor="middle" class="mono node" fill="#334155">(tag, r)</text>
  <line x1="172" y1="60" x2="206" y2="60" stroke="#2563eb" stroke-width="1.8" marker-end="url(#k-blue)"/>
  <text x="189" y="52" text-anchor="middle" class="sans f" fill="#2563eb">f</text>
  <rect x="212" y="42" width="130" height="36" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="277" y="64" text-anchor="middle" class="mono node" fill="#1e3a8a">(HASH, g(r))</text>

  <!-- Vertical green barrier between lanes -->
  <line x1="364" y1="22" x2="364" y2="96" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="310" y="88" width="108" height="20" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="364" y="101.5" text-anchor="middle" class="sans" font-size="9.5" font-weight="700" fill="#065f46">BRIDGE ≠ HASH</text>

  <text x="390" y="30" class="sans tag" fill="#b45309">RAMP LANE (tag = RAMP)</text>
  <rect x="390" y="42" width="122" height="36" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="451" y="64" text-anchor="middle" class="mono node" fill="#991b1b">(RAMP, r)</text>
  <line x1="516" y1="60" x2="550" y2="60" stroke="#d97706" stroke-width="1.8" marker-end="url(#k-amber)"/>
  <text x="533" y="52" text-anchor="middle" class="sans f" fill="#d97706">f</text>
  <rect x="556" y="42" width="132" height="36" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="622" y="64" text-anchor="middle" class="mono node" fill="#92400e">(BRIDGE, r)</text>

  <!-- Horizontal section divider -->
  <line x1="32" y1="126" x2="688" y2="126" stroke="#e4e4e7" stroke-width="1"/>

  <!-- BOTTOM: THE 2-STEP FORGERY -->
  <text x="32" y="150" class="sans tag" fill="#991b1b">WINTERNITZ FORGERY (MERGES AT POSITION 2)</text>

  <!-- Real chain row -->
  <rect x="32" y="168" width="118" height="42" rx="8" fill="#f4f4f5" stroke="#a1a1aa" stroke-dasharray="4 3"/>
  <text x="91" y="193" text-anchor="middle" class="sans sub">pos 0 · unknown</text>

  <line x1="154" y1="189" x2="190" y2="189" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#k-slate)"/>
  <text x="172" y="181" text-anchor="middle" class="sans f" fill="#71717a">f</text>

  <rect x="196" y="168" width="140" height="42" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="266" y="187" text-anchor="middle" class="mono node" fill="#115e59">σ₁ = (tag, r)</text>
  <text x="266" y="202" text-anchor="middle" class="sans" font-size="10" font-weight="700" fill="#0f766e">pos 1 · revealed</text>

  <line x1="340" y1="189" x2="380" y2="189" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#k-slate)"/>
  <text x="360" y="181" text-anchor="middle" class="sans f" fill="#71717a">f</text>

  <rect x="386" y="168" width="144" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="458" y="187" text-anchor="middle" class="mono node" fill="#1e3a8a">(HASH, g(r))</text>
  <text x="458" y="202" text-anchor="middle" class="sans" font-size="10" fill="#1d4ed8">pos 2 = f(σ₁)</text>

  <line x1="534" y1="189" x2="594" y2="189" stroke="#2563eb" stroke-width="1.8" marker-end="url(#k-blue)"/>
  <text x="564" y="180" text-anchor="middle" class="mono" font-size="11" fill="#1d4ed8">f<tspan dy="-4" font-size="8.5">w−3</tspan></text>

  <rect x="600" y="168" width="88" height="42" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="644" y="193" text-anchor="middle" class="mono node" fill="#1e3a8a">pk₁</text>

  <!-- Forged row -->
  <rect x="32" y="248" width="118" height="42" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="91" y="267" text-anchor="middle" class="mono node" fill="#991b1b">(RAMP, r)</text>
  <text x="91" y="282" text-anchor="middle" class="sans" font-size="10" font-weight="700" fill="#b91c1c">forged σ₁*</text>

  <line x1="154" y1="269" x2="190" y2="269" stroke="#dc2626" stroke-width="2" marker-end="url(#k-red)"/>
  <text x="172" y="261" text-anchor="middle" class="sans f" fill="#dc2626">f</text>

  <rect x="196" y="248" width="140" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="266" y="267" text-anchor="middle" class="mono node" fill="#92400e">(BRIDGE, r)</text>
  <text x="266" y="282" text-anchor="middle" class="sans" font-size="10" fill="#b45309">2nd preimage</text>

  <path d="M 336 269 C 408 269, 458 254, 458 216" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#k-red)"/>
  <text x="414" y="250" text-anchor="middle" class="sans f" fill="#dc2626">f</text>
  <text x="480" y="265" class="sans" font-size="11.5" font-weight="700" fill="#dc2626">f takes normal lane</text>
  <text x="480" y="282" class="sans sub">because BRIDGE ≠ RAMP</text>
</svg>
