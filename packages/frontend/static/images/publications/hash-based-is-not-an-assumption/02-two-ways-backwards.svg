<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 278" width="720" height="278" role="img" aria-labelledby="t2 d2">
  <title id="t2">Two ways to forge digit 0 from revealed v1</title>
  <desc id="d2">Graph showing the real chain v0 to v1 to v2 to v3, with Case 1 inverting v1 directly above and Case 2 branching through a second preimage u to merge at v2 below.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
      .node { font-size: 13px; font-weight: 600; }
      .sub { font-size: 10.5px; fill: #71717a; }
      .f { font-size: 12px; font-style: italic; font-weight: 600; fill: #71717a; }
    </style>
    <marker id="m-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="719" height="277" rx="12" fill="#ffffff" stroke="#e4e4e7"/>

  <!-- CASE 1 (ABOVE) -->
  <rect x="44" y="24" width="102" height="44" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="95" y="45" text-anchor="middle" class="mono node" fill="#065f46">σ*</text>
  <text x="95" y="60" text-anchor="middle" class="sans" font-size="10.5" fill="#047857">forged</text>

  <path d="M 146 46 C 216 46, 266 64, 266 108" fill="none" stroke="#059669" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#m-green)"/>
  <text x="206" y="42" text-anchor="middle" class="sans f" fill="#059669">f</text>
  <text x="276" y="46" class="sans" font-size="12" font-weight="700" fill="#065f46">Case 1: invert v₁</text>
  <text x="276" y="63" class="sans" font-size="11" fill="#047857">blocked by one-wayness</text>

  <!-- REAL CHAIN (MIDDLE) -->
  <rect x="44" y="116" width="102" height="44" rx="8" fill="#f4f4f5" stroke="#a1a1aa" stroke-dasharray="4 3"/>
  <text x="95" y="137" text-anchor="middle" class="mono node" fill="#52525b">v₀</text>
  <text x="95" y="152" text-anchor="middle" class="sans sub">secret</text>

  <line x1="150" y1="138" x2="208" y2="138" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#m-slate)"/>
  <text x="179" y="129" text-anchor="middle" class="sans f">f</text>

  <rect x="214" y="116" width="104" height="44" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.2"/>
  <text x="266" y="137" text-anchor="middle" class="mono node" fill="#115e59">v₁</text>
  <text x="266" y="152" text-anchor="middle" class="sans" font-size="10.5" font-weight="700" fill="#0f766e">revealed</text>

  <line x1="322" y1="138" x2="380" y2="138" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#m-slate)"/>
  <text x="351" y="129" text-anchor="middle" class="sans f">f</text>

  <rect x="386" y="116" width="104" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="438" y="137" text-anchor="middle" class="mono node" fill="#1e40af">v₂</text>
  <text x="438" y="152" text-anchor="middle" class="sans" font-size="10.5" fill="#1d4ed8">merge point</text>

  <line x1="494" y1="138" x2="552" y2="138" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#m-slate)"/>
  <text x="523" y="129" text-anchor="middle" class="sans f">f</text>

  <rect x="558" y="116" width="118" height="44" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="617" y="142" text-anchor="middle" class="mono node" fill="#1e3a8a">v₃ = pk</text>

  <!-- CASE 2 (BELOW) -->
  <rect x="44" y="206" width="102" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="95" y="227" text-anchor="middle" class="mono node" fill="#991b1b">σ*</text>
  <text x="95" y="242" text-anchor="middle" class="sans" font-size="10.5" fill="#b91c1c">forged</text>

  <line x1="150" y1="228" x2="208" y2="228" stroke="#dc2626" stroke-width="2" marker-end="url(#m-red)"/>
  <text x="179" y="219" text-anchor="middle" class="sans f" fill="#dc2626">f</text>

  <rect x="214" y="206" width="104" height="44" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="266" y="227" text-anchor="middle" class="mono node" fill="#92400e">u ≠ v₁</text>
  <text x="266" y="242" text-anchor="middle" class="sans" font-size="10.5" fill="#b45309">2nd preimage</text>

  <path d="M 318 228 C 390 228, 438 208, 438 166" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#m-red)"/>

  <text x="464" y="222" class="sans" font-size="12" font-weight="700" fill="#b91c1c">Case 2: branch &amp; merge</text>
  <text x="464" y="240" class="sans" font-size="11" fill="#7f1d1d">f(u) = f(v₁) = v₂ (never inverts v₁)</text>
</svg>
