<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 404" width="720" height="404" role="img" aria-labelledby="t2b d2b">
  <title id="t2b">Second-preimage resistance versus merge resistance</title>
  <desc id="d2b">Two-panel diagram using a toy hash that drops the last input bit before SHA-256. Top panel shows second-preimage resistance is trivially broken by flipping the last bit of v1 to get u. Bottom panel shows merge resistance still holds because forging digit 0 requires finding a preimage sigma star of u.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
      .node { font-size: 12px; font-weight: 600; }
      .sub { font-size: 10px; fill: #71717a; }
      .f { font-size: 11.5px; font-style: italic; font-weight: 600; fill: #71717a; }
      .tag { font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; }
    </style>
    <marker id="m2b-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="m2b-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="m2b-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="719" height="403" rx="12" fill="#ffffff" stroke="#e4e4e7"/>

  <!-- TOP BAR: TOY HASH -->
  <text x="28" y="33" class="sans tag" fill="#52525b">TOY HASH</text>
  <rect x="106" y="16" width="298" height="26" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
  <text x="255" y="33" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#18181b">f(x) = SHA-256(x without last bit)</text>
  <text x="692" y="33" text-anchor="end" class="sans" font-size="11" fill="#71717a">ignores final bit of input</text>

  <line x1="28" y1="54" x2="692" y2="54" stroke="#e4e4e7" stroke-width="1"/>

  <!-- PANEL 1: SECOND-PREIMAGE RESISTANCE -->
  <text x="28" y="78" class="sans tag" fill="#18181b">1. SECOND-PREIMAGE RESISTANCE</text>
  <rect x="572" y="63" width="120" height="20" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="632" y="76.5" text-anchor="middle" class="sans" font-size="9.5" font-weight="700" fill="#b91c1c">BROKEN INSTANTLY</text>

  <!-- Real chain (Panel 1) -->
  <rect x="28" y="96" width="110" height="42" rx="8" fill="#f4f4f5" stroke="#a1a1aa" stroke-dasharray="4 3"/>
  <text x="83" y="115" text-anchor="middle" class="mono node" fill="#52525b">v₀</text>
  <text x="83" y="130" text-anchor="middle" class="sans sub">pos 0 · secret</text>

  <line x1="142" y1="117" x2="186" y2="117" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#m2b-slate)"/>
  <text x="164" y="109" text-anchor="middle" class="sans f">f</text>

  <rect x="192" y="96" width="134" height="42" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="259" y="115" text-anchor="middle" class="mono node" fill="#115e59">v₁ = ...101<tspan fill="#0284c7" font-weight="700">0</tspan></text>
  <text x="259" y="130" text-anchor="middle" class="sans" font-size="10" font-weight="700" fill="#0f766e">pos 1 · revealed</text>

  <line x1="330" y1="117" x2="384" y2="117" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#m2b-slate)"/>
  <text x="357" y="109" text-anchor="middle" class="sans f">f</text>

  <rect x="390" y="96" width="132" height="42" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="456" y="115" text-anchor="middle" class="mono node" fill="#1e40af">v₂</text>
  <text x="456" y="130" text-anchor="middle" class="sans" font-size="9.5" fill="#1d4ed8">SHA-256(...101)</text>

  <line x1="526" y1="117" x2="574" y2="117" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#m2b-slate)"/>
  <text x="550" y="109" text-anchor="middle" class="sans f">f</text>

  <rect x="580" y="96" width="112" height="42" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="636" y="121" text-anchor="middle" class="mono node" fill="#1e3a8a">v₃ = pk</text>

  <!-- Flip bit arrow -->
  <line x1="259" y1="140" x2="259" y2="164" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="3 2" marker-end="url(#m2b-red)"/>
  <text x="268" y="156" class="sans" font-size="10" font-weight="700" fill="#dc2626">flip last bit</text>

  <!-- u box (Panel 1) -->
  <rect x="192" y="170" width="134" height="42" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="259" y="189" text-anchor="middle" class="mono node" fill="#991b1b">u = ...101<tspan fill="#dc2626" font-weight="700">1</tspan></text>
  <text x="259" y="204" text-anchor="middle" class="sans" font-size="10" font-weight="700" fill="#b91c1c">2nd preimage</text>

  <path d="M 326 191 C 396 191, 448 178, 456 144" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#m2b-red)"/>
  <text x="468" y="195" class="sans" font-size="11" font-weight="600" fill="#b91c1c">same prefix ...101 → same v₂</text>

  <line x1="28" y1="230" x2="692" y2="230" stroke="#e4e4e7" stroke-width="1"/>

  <!-- PANEL 2: MERGE RESISTANCE -->
  <text x="28" y="254" class="sans tag" fill="#18181b">2. MERGE RESISTANCE (WHAT CASE 2 NEEDS)</text>
  <rect x="604" y="239" width="88" height="20" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="648" y="252.5" text-anchor="middle" class="sans" font-size="9.5" font-weight="700" fill="#065f46">STILL HOLDS</text>

  <!-- Real chain (Panel 2) -->
  <rect x="28" y="270" width="110" height="42" rx="8" fill="#f4f4f5" stroke="#a1a1aa" stroke-dasharray="4 3"/>
  <text x="83" y="289" text-anchor="middle" class="mono node" fill="#52525b">v₀</text>
  <text x="83" y="304" text-anchor="middle" class="sans sub">pos 0 · secret</text>

  <line x1="142" y1="291" x2="186" y2="291" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#m2b-slate)"/>
  <text x="164" y="283" text-anchor="middle" class="sans f">f</text>

  <rect x="192" y="270" width="134" height="42" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="259" y="289" text-anchor="middle" class="mono node" fill="#115e59">v₁ = ...101<tspan fill="#0284c7" font-weight="700">0</tspan></text>
  <text x="259" y="304" text-anchor="middle" class="sans" font-size="10" font-weight="700" fill="#0f766e">pos 1 · revealed</text>

  <line x1="330" y1="291" x2="384" y2="291" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#m2b-slate)"/>
  <text x="357" y="283" text-anchor="middle" class="sans f">f</text>

  <rect x="390" y="270" width="132" height="42" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="456" y="289" text-anchor="middle" class="mono node" fill="#1e40af">v₂</text>
  <text x="456" y="304" text-anchor="middle" class="sans" font-size="9.5" fill="#1d4ed8">SHA-256(...101)</text>

  <line x1="526" y1="291" x2="574" y2="291" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#m2b-slate)"/>
  <text x="550" y="283" text-anchor="middle" class="sans f">f</text>

  <rect x="580" y="270" width="112" height="42" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="636" y="295" text-anchor="middle" class="mono node" fill="#1e3a8a">v₃ = pk</text>

  <!-- Missing sigma* box -->
  <rect x="28" y="342" width="110" height="42" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="83" y="361" text-anchor="middle" class="mono node" fill="#065f46">σ* = ?</text>
  <text x="83" y="376" text-anchor="middle" class="sans" font-size="10" font-weight="700" fill="#047857">pos 0 · target</text>

  <!-- Blocked step sigma* -> u -->
  <line x1="142" y1="363" x2="188" y2="363" stroke="#059669" stroke-width="1.8" stroke-dasharray="4 3"/>
  <line x1="160" y1="352" x2="170" y2="374" stroke="#059669" stroke-width="2.2"/>
  <line x1="170" y1="352" x2="160" y2="374" stroke="#059669" stroke-width="2.2"/>
  <text x="165" y="345" text-anchor="middle" class="sans" font-size="9.5" font-weight="700" fill="#047857">invert?</text>

  <!-- u box (Panel 2) -->
  <rect x="192" y="342" width="134" height="42" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="259" y="361" text-anchor="middle" class="mono node" fill="#92400e">u = ...101<tspan fill="#d97706" font-weight="700">1</tspan></text>
  <text x="259" y="376" text-anchor="middle" class="sans" font-size="10" font-weight="600" fill="#b45309">free, but pos 1</text>

  <!-- Dashed amber curve u -> v2 -->
  <path d="M 326 363 C 388 363, 434 348, 446 318" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#m2b-amber)"/>

  <!-- Right callout -->
  <text x="458" y="360" class="sans" font-size="11.5" font-weight="700" fill="#18181b">Flipping a bit gives u, not σ*</text>
  <text x="458" y="376" class="sans" font-size="10.5" fill="#52525b">Finding σ* still means inverting SHA-256 on u</text>
</svg>
