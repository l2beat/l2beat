<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 398" width="720" height="398" role="img" aria-labelledby="t4 d4">
  <title id="t4">The cryptographic assumption stack for Keccak</title>
  <desc id="d4">Four-tier cumulative assumption stack showing two boundaries: above One-Wayness Only (the theoretical minimum), and above what Ethereum assumes for Keccak-256 today (256-bit state and transaction collision resistance, 160-bit addresses), adding Winternitz/WOTS+/XMSS/SPHINCS+ undetectability and Ethereum's leanXMSS, leanSPHINCS, leanVM, and LeanDA stack, with a note on SHA-256's existing random-oracle and pseudorandomness usage.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
      .tier { font-size: 13px; font-weight: 700; }
      .sub { font-size: 10.5px; }
      .pill { font-size: 9.3px; font-weight: 600; }
    </style>
    <marker id="u-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a1a1aa"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="719" height="397" rx="12" fill="#ffffff" stroke="#e4e4e7"/>

  <!-- Left cumulative arrow -->
  <line x1="38" y1="322" x2="38" y2="30" stroke="#a1a1aa" stroke-width="2" marker-end="url(#u-arr)"/>
  <text x="22" y="176" text-anchor="middle" transform="rotate(-90 22 176)" class="sans" font-size="10" font-weight="700" fill="#71717a" letter-spacing="0.09em">CUMULATIVE STACK</text>

  <!-- Tier 3: Ethereum PQ stack -->
  <rect x="62" y="22" width="632" height="52" rx="9" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5"/>
  <text x="80" y="44" class="sans tier" fill="#581c87">+ Ideal Keccak-f[1600] + Recursive zkVM</text>
  <text x="80" y="61" class="sans sub" fill="#7e22ce">128-bit outputs · unproved recursive FS · no quantum proof</text>
  <rect x="424" y="36" width="256" height="24" rx="12" fill="#f3e8ff" stroke="#d8b4fe"/>
  <text x="552" y="51.5" text-anchor="middle" class="mono pill" fill="#6b21a8">leanXMSS · leanSPHINCS · leanVM · LeanDA</text>

  <!-- Tier 2: Winternitz / XMSS / SPHINCS+ -->
  <rect x="62" y="86" width="632" height="52" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="80" y="108" class="sans tier" fill="#1e3a8a">+ Undetectability of Hash Chains</text>
  <text x="80" y="125" class="sans sub" fill="#1d4ed8">Distinguishing assumption not implied by collision resistance</text>
  <rect x="436" y="100" width="244" height="24" rx="12" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="558" y="115.5" text-anchor="middle" class="mono pill" fill="#1e40af">Winternitz / WOTS+ · XMSS · SPHINCS+</text>

  <!-- Line 2: Ethereum today for Keccak-256 -->
  <line x1="62" y1="160" x2="694" y2="160" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="252" y="148" width="252" height="24" rx="12" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="378" y="163.5" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#b45309">Ethereum today, for Keccak-256 ↓</text>

  <!-- Tier 1: Collision / 2PR (Ethereum today for Keccak) -->
  <rect x="62" y="182" width="632" height="52" rx="9" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
  <text x="80" y="204" class="sans tier" fill="#0f172a">Collision &amp; Second-Preimage Resistance</text>
  <text x="80" y="221" class="sans sub" fill="#475569">Covers merge resistance · 256-bit state &amp; tx · 160-bit addresses</text>
  <rect x="504" y="196" width="176" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="592" y="211.5" text-anchor="middle" class="mono pill" fill="#334155">state · tx · addresses</text>

  <!-- Line 1: Theoretical minimum -->
  <line x1="62" y1="256" x2="694" y2="256" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="282" y="244" width="192" height="24" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="378" y="259.5" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#b91c1c">Minimal assumption ↓</text>

  <!-- Tier 0: Base -->
  <rect x="62" y="278" width="632" height="52" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="80" y="300" class="sans tier" fill="#064e3b">One-Wayness Only</text>
  <text x="80" y="317" class="sans sub" fill="#047857">Preimage resistance alone · zero extra assumptions</text>
  <rect x="526" y="292" width="154" height="24" rx="12" fill="#d1fae5" stroke="#6ee7b7"/>
  <text x="603" y="307.5" text-anchor="middle" class="mono pill" fill="#065f46">Lamport · Rompel</text>

  <!-- SHA-256 note strip -->
  <rect x="62" y="344" width="632" height="40" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="76" y="361" class="sans" font-size="9.5" fill="#78350f"><tspan font-weight="700">Note on SHA-256 today:</tspan> Consensus already models SHA-256 as a random oracle in BLS (RFC 9380)</text>
  <text x="76" y="375" class="sans" font-size="9.5" fill="#78350f">and single-round KZG (EIP-4844/7594), and for public pseudorandomness in RANDAO and shuffling.</text>
</svg>
