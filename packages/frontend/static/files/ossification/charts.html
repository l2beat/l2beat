/* ---------- theme: follow the parent page's .dark class ---------- */
function detectTheme(){
  try{
    if(parent!==window)
      return parent.document.documentElement.classList.contains("dark")?"dark":"light";
  }catch(e){}
  try{
    const t=localStorage.getItem("theme"); /* next-themes default storage key */
    if(t==="dark"||t==="light")return t;
  }catch(e){}
  return matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
}
function applyTheme(){
  const t=detectTheme();
  if(document.documentElement.dataset.theme!==t){document.documentElement.dataset.theme=t;render();}
}
try{
  if(parent!==window)
    new MutationObserver(applyTheme).observe(parent.document.documentElement,{attributes:true,attributeFilter:["class"]});
}catch(e){
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme);
}

/* ---------- formatting ---------- */
const fmtUsd=v=>{
  const u=[["B",1e9],["M",1e6],["K",1e3]];
  for(const [s,m] of u) if(v>=m){
    const x=v/m;
    let str=x>=100?String(Math.round(x)):x>=10?x.toFixed(1):x.toFixed(2);
    str=str.includes(".")?str.replace(/0+$/,"").replace(/\.$/,""):str;
    return "$"+str+s;
  }
  return "$"+Math.round(v).toLocaleString();
};
const fmtAge=s=>{
  if(s<2*3600)return Math.max(1,Math.round(s/60))+" min";
  if(s<2*DAY)return Math.round(s/3600)+" h";
  if(s<90*DAY)return Math.round(s/DAY)+" d";
  if(s<2*365.25*DAY)return Math.round(s/(30.44*DAY))+" mo";
  return (s/YEAR).toFixed(1)+" y";
};

/* ---------- shared pieces ---------- */
function ecdfPoints(rows,weightFn){
  const pts=rows.map(d=>({x:clampA(d.a),w:weightFn(d)})).sort((p,q)=>p.x-q.x);
  const tot=pts.reduce((a,p)=>a+p.w,0);
  let c=0;const out=[];
  for(const p of pts){c+=p.w;out.push([p.x,c/tot]);}
  return out;
}
function stepPath(pts,X,Y){
  if(!pts.length)return "";
  let d=`M${X(pts[0][0])},${Y(0)}`,py=0;
  for(const [x,y] of pts){d+=`L${X(x)},${Y(py)}L${X(x)},${Y(y)}`;py=y;}
  d+=`L${X(ageEnd())},${Y(py)}`;
  return d;
}
function drawAgeAxis(svg,X,Y0,pl,pr,W){
  for(const [v,lab] of ageTicks()){

    el("line",{x1:x,y1:14,x2:x,y2:Y0,class:"gl"},svg);
    txt(svg,x,Y0+15,lab,"tick","middle");
  }
  el("line",{x1:pl,y1:Y0,x2:W-pr,y2:Y0,class:"ax"},svg);
}

}

  const hit=el("rect",{x:pl,y:pt,width:W-pl-pr,height:H-pt-pb,fill:"transparent"},svg);
  hit.addEventListener("pointermove",evt=>{
    const [mx]=svgPt(svg,evt,W,H);
    const x=Math.max(pl,Math.min(W-pr,mx));
    cross.setAttribute("x1",x);cross.setAttribute("x2",x);cross.setAttribute("visibility","visible");
    const age=ageInv(x,pl,W-pr);
    const cv=at(cPts,age),lv=at(lPts,age);
    tipShow(evt,"code age ≤ "+fmtAge(age),[
      {color:css("--s1"),value:Math.round(cv*100)+"%",label:"of exploits ("+Math.round(cv*rows.length)+" of "+rows.length+")"},
      {color:css("--s2"),value:Math.round(lv*100)+"%",label:"of stolen USD"},
    ]);
  });
  hit.addEventListener("pointerleave",()=>{cross.setAttribute("visibility","hidden");tipHide();});
}

/* ================= scatter ================= */
function renderScatter(){
  const W=720,H=420,pl=50,pr=16,pt=24,pb=30;
  const svg=mkSvg(W,H);
  const X=v=>ageX(v,pl,W-pr);
  const LMIN=1e3,LMAX=1e9;
  const Y=v=>H-pb-(Math.log(Math.max(LMIN,Math.min(v,LMAX)))-Math.log(LMIN))/(Math.log(LMAX)-Math.log(LMIN))*(H-pt-pb);
  legendRow([["lswatch",css("--s1"),"incident"],["lkey",css("--s2"),"trend-line (least-squares fit, log loss on log age)"]]);
  for(const [v,lab] of USD_TICKS){
    el("line",{x1:pl,y1:Y(v),x2:W-pr,y2:Y(v),class:"gl"},svg);
    txt(svg,pl-6,Y(v)+3.5,lab,"tick","end");
  }
  drawAgeAxis(svg,X,H-pb,pl,pr,W);
  txt(svg,W-pr,H-2,"code age at exploit →","axl","end");
  txt(svg,pl,10,"incident loss","axl");
  if(TH>1000){
    el("line",{x1:pl,y1:Y(TH),x2:W-pr,y2:Y(TH),stroke:css("--ink2"),"stroke-width":1.5,"stroke-dasharray":"5 4"},svg);
    txt(svg,W-pr-4,Y(TH)-5,"threshold "+fmtUsd(TH),"dlabel","end");
  }
  const pts=[];
  const dim=css("--dim"),blue=css("--s1"),surf=css("--surface");
  for(const d of D){
    const sel=d.l>=TH;
    const c=el("circle",{cx:X(d.a),cy:Y(d.l),r:4,fill:sel?blue:dim,stroke:surf,"stroke-width":2,"fill-opacity":sel?.85:1},svg);
    pts.push({x:X(d.a),y:Y(d.l),d,c});
  }
  /* OLS fit of log(loss) on log(age), drawn only across the admitted age range */
  const sel=D.filter(d=>d.l>=TH);
  if(sel.length>=10){
    const lx=sel.map(d=>Math.log(Math.max(d.a,1))),ly=sel.map(d=>Math.log(d.l));
    const mx=lx.reduce((a,b)=>a+b)/lx.length,my=ly.reduce((a,b)=>a+b)/ly.length;
    const slope=lx.reduce((s,x,i)=>s+(x-mx)*(ly[i]-my),0)/lx.reduce((s,x)=>s+(x-mx)**2,0);
    const fit=age=>Math.exp(my+slope*(Math.log(Math.max(age,1))-mx));
    const x0=ageX(Math.min(...sel.map(d=>d.a)),pl,W-pr),x1=ageX(Math.max(...sel.map(d=>d.a)),pl,W-pr);
    const path=[];
    for(let px=x0;px<=x1;px+=8)path.push(px+","+Y(fit(ageInv(px,pl,W-pr))));
    el("path",{d:"M"+path.join("L"),fill:"none",stroke:css("--s2"),"stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"},svg);
  }
  const selPts=pts.filter(p=>p.d.l>=TH);
  if(selPts.length){
    const top=selPts.reduce((a,b)=>b.d.l>a.d.l?b:a);
    txt(svg,top.x,top.y-8,top.d.p,"dlabel","middle");
  }
  const hit=el("rect",{x:0,y:0,width:W,height:H,fill:"transparent"},svg);
  let hov=null;
  hit.addEventListener("pointermove",evt=>{
    const [mx,my]=svgPt(svg,evt,W,H);
    let best=null,bd=24*24;
    for(const p of pts){const dx=p.x-mx,dy=p.y-my,dd=dx*dx+dy*dy;if(dd<bd){bd=dd;best=p;}}
    if(hov&&hov!==best){hov.c.setAttribute("r",4);hov=null;}
    if(best){
      hov=best;best.c.setAttribute("r",6);
      tipShow(evt,best.d.p,[
        {value:fmtUsd(best.d.l),label:"incident loss"},
        {value:fmtAge(best.d.a),label:"code age · "+KINDS[best.d.k]},
        {value:fmtDate(best.d.t),label:CHAINS[best.d.c]||("chain "+best.d.c)},
      ]);
    }else tipHide();
  });
  hit.addEventListener("pointerleave",()=>{if(hov){hov.c.setAttribute("r",4);hov=null;}tipHide();});
}

/* ================= kinds ================= */
function renderKinds(){
  const rows=filtered();
  const W=720,H=320,pl=42,pr=16,pt=16,pb=30;
  const svg=mkSvg(W,H);
  const X=v=>ageX(v,pl,W-pr);
  const Y=v=>H-pb-v*(H-pt-pb);
  for(let p=0;p<=100;p+=50){
    el("line",{x1:pl,y1:Y(p/100),x2:W-pr,y2:Y(p/100),class:"gl"},svg);
    txt(svg,pl-6,Y(p/100)+3.5,p+"%","tick","end");
  }
  const AX=AGELIN?AGE_TICKS_LIN_SPARSE:[[3600,"1h"],[DAY,"1d"],[30*DAY,"1mo"],[YEAR,"1y"],[10*YEAR,"10y"]];
  for(const [v,lab] of AX){
    el("line",{x1:X(v),y1:pt,x2:X(v),y2:Y(0),class:"gl"},svg);
    txt(svg,X(v),Y(0)+15,lab,"tick","middle");
  }
  el("line",{x1:pl,y1:Y(0),x2:W-pr,y2:Y(0),class:"ax"},svg);
  const series=[],legItems=[];
  KINDS.forEach((name,ki)=>{
    const sub=rows.filter(d=>d.k===ki);
    legItems.push(["lkey",css(KINDCOL[ki]),name+" ("+sub.length+")"]);
    if(sub.length<2)return;
    const pts=ecdfPoints(sub,()=>1);
    el("path",{d:stepPath(pts,X,Y),fill:"none",stroke:css(KINDCOL[ki]),"stroke-width":2,"stroke-linejoin":"round"},svg);
    series.push({name,ki,pts,n:sub.length});
  });
  legendRow(legItems);
  const anchors=[0.30,0.52,0.70,0.86];
  series.forEach((s,i)=>{
    const x=ageInv(pl+anchors[i%4]*(W-pl-pr),pl,W-pr);
    let y=0;for(const [px,py] of s.pts){if(px<=x)y=py;else break;}
    txt(svg,X(x),Y(y)-6,s.name.replace("-change",""),"dlabel","middle").style.fill=css(KINDCOL[s.ki]);
  });
  const cross=el("line",{x1:0,y1:pt,x2:0,y2:Y(0),class:"ax",visibility:"hidden"},svg);
  const hit=el("rect",{x:pl,y:pt,width:W-pl-pr,height:H-pt-pb,fill:"transparent"},svg);
  hit.addEventListener("pointermove",evt=>{
    const [mx]=svgPt(svg,evt,W,H);
    const x=Math.max(pl,Math.min(W-pr,mx));
    cross.setAttribute("x1",x);cross.setAttribute("x2",x);cross.setAttribute("visibility","visible");
    const age=ageInv(x,pl,W-pr);
    tipShow(evt,"code age ≤ "+fmtAge(age),series.map(s=>{
      let y=0;for(const [px,py] of s.pts){if(px<=age)y=py;else break;}
      return {color:css(KINDCOL[s.ki]),value:Math.round(y*100)+"%",label:s.name+" (n="+s.n+")"};
    }));
  });
  hit.addEventListener("pointerleave",()=>{cross.setAttribute("visibility","hidden");tipHide();});
}

/* ================= controls ================= */
const RENDERERS={curve:renderCurve,scatter:renderScatter,kinds:renderKinds};
const PRESETS=[1e3,1e4,1e5,1e6,1e7,1e8];
let slider,thval,chipbox,axbox,countEl;
function buildControls(){
  const box=document.getElementById("controls");box.textContent="";
  const l=document.createElement("span");l.className="flabel";l.textContent="Loss threshold";box.appendChild(l);
  thval=document.createElement("span");thval.className="thval";box.appendChild(thval);
  slider=document.createElement("input");slider.type="range";slider.min="0";slider.max="120";slider.step="1";
  slider.setAttribute("aria-label","Minimum loss in USD, logarithmic");
  slider.addEventListener("input",()=>setThreshold(Math.pow(10,3+slider.value/20)));
  box.appendChild(slider);
  chipbox=document.createElement("span");chipbox.className="chips";
  for(const v of PRESETS){
    const b=document.createElement("button");b.className="chip";b.type="button";b.textContent=fmtUsd(v);
    b.addEventListener("click",()=>setThreshold(v));
    chipbox.appendChild(b);
  }
  box.appendChild(chipbox);
  axbox=document.createElement("span");axbox.className="chips";
  [["log",false],["linear",true]].forEach(([lab,lin])=>{
    const b=document.createElement("button");b.className="chip";b.type="button";b.textContent=lab;
    b.addEventListener("click",()=>{if(AGELIN!==lin){AGELIN=lin;render();}});
    axbox.appendChild(b);
  });
  box.appendChild(axbox);
  countEl=document.createElement("span");countEl.className="count";box.appendChild(countEl);
}
function syncControls(){
  thval.textContent=fmtUsd(TH);
  slider.value=Math.round((Math.log10(TH)-3)*20);
  [...chipbox.children].forEach((c,i)=>c.setAttribute("aria-pressed",PRESETS[i]===TH?"true":"false"));
  [...axbox.children].forEach((c,i)=>c.setAttribute("aria-pressed",(i===1)===AGELIN?"true":"false"));
  countEl.textContent=filtered().length+" / "+D.length+" incidents ≥ "+fmtUsd(TH);
}
function roundTh(th){
  const m=Math.pow(10,Math.floor(Math.log10(th)));
  return Math.round(th/(m/10))*(m/10);
}
let raf=0;
function render(){
  syncControls();
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(()=>{
    if(Object.prototype.hasOwnProperty.call(RENDERERS,CHART))RENDERERS[CHART]();
  });
}
function setThreshold(th){
  TH=Math.max(1000,Math.min(1e9,roundTh(th)));
  try{localStorage.setItem(THKEY,String(TH));}catch(e){}
  render();
}
addEventListener("storage",e=>{
  if(e.key===THKEY&&e.newValue){
    const v=+e.newValue;
    if(v>=1000&&v!==TH){TH=v;render();}
  }
  if(e.key==="theme")applyTheme();
});
try{
  const saved=+localStorage.getItem(THKEY);
  if(saved>=1000&&saved<=1e9)TH=saved;
}catch(e){}
buildControls();
render();
</script>
