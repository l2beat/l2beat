<!doctype html>
<!-- iOS Safari tints its status bar with html + body backgrounds blended, so on mobile they match the top navbar.
     Body has no background: SidebarProvider paints the page gray. -->
<html lang="en" class="has-[.smooth-scroll]:scroll-smooth bg-header-primary lg:bg-background">

<head>
  <!--app-head-->
  <link rel="stylesheet" href="/src/styles/globals.css" />
</head>

<body
  class="text-base text-primary md:text-lg font-roboto">
  <script><!--ssr-data--></script>
  <script><!--env-data--></script>
  <div id="root"><!--app-html--></div>
  <!-- One-time script to overwrite the stale cached 301 redirect for "/" (can be removed a few months after "/" stops redirecting) -->
  <script>
    (function () { try { if (window.location.pathname === "/" || localStorage.getItem("root-redirect-cache-purged")) return; fetch("/", { cache: "reload", redirect: "manual" }).then(function () { localStorage.setItem("root-redirect-cache-purged", "1") }).catch(function () { }) } catch (e) { } })();
  </script>
  <script type="module" src="/src/ssr/ClientEntry.tsx"></script>
</body>

</html>
