<!doctype html>
<!-- iOS Safari tints its status bar with html + body backgrounds blended, so on mobile they match the top navbar.
     Body has no background: SidebarProvider paints the page gray. -->
<html lang="en" class="has-[.smooth-scroll]:scroll-smooth bg-header-primary lg:bg-background">

<head>
  <!-- Page transitions (see globals.css). Inline, so they act before the
       module entry runs.
       - Back and forward load without a transition: it would capture the page
         before the browser restores the scroll position, which then jumps.
         Skipping rejects `ready`, so it is caught rather than reported as an
         unhandled error.
       - A transition captures the new page's first render, which over the
         network can come before the nav has arrived: the old page then fades
         into a blank one. For a navigation that animates, hold that render
         until the sidebar has parsed (the mobile navbar comes before it).
         Loads that don't animate paint as soon as they can. -->
  <script>
    addEventListener('pageswap', function (e) { var t = e.viewTransition; if (t && e.activation && e.activation.navigationType === 'traverse') { t.ready.catch(function () { }); t.skipTransition() } });
    (function () {
      var a = window.navigation && navigation.activation
      if (!a || !a.from || (a.navigationType !== 'push' && a.navigationType !== 'replace')) return
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return
      var expect = document.createElement('link')
      expect.rel = 'expect'
      expect.href = '#nav-sidebar'
      expect.setAttribute('blocking', 'render')
      document.head.append(expect)
    })()
  </script>
  <!--app-head-->
  <link rel="stylesheet" href="/src/styles/globals.css" />
</head>

<body
  class="text-base text-primary md:text-lg font-roboto">
  <div id="root"><!--app-html--></div>
  <!-- After #root, so the SSR markup paints before the browser downloads the data -->
  <script type="application/json" id="env-data"><!--env-data--></script>
  <script type="application/json" id="ssr-data"><!--ssr-data--></script>
  <!-- One-time script to overwrite the stale cached 301 redirect for "/" (can be removed a few months after "/" stops redirecting) -->
  <script>
    (function () { try { if (window.location.pathname === "/" || localStorage.getItem("root-redirect-cache-purged")) return; fetch("/", { cache: "reload", redirect: "manual" }).then(function () { localStorage.setItem("root-redirect-cache-purged", "1") }).catch(function () { }) } catch (e) { } })();
  </script>
  <script type="module" src="/src/ssr/ClientEntry.tsx"></script>
</body>

</html>
