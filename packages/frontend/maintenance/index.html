    :root {
      color-scheme: light dark;
      /* ETHBEAT palette, from ../src/styles/globals.css */
      --color-paper: #e6e7ec;
      --color-surface: #fafafa;
      --color-ink: #131215;
      --color-ink-2: #5f6470;
      --color-brand: #ff3776;
      --color-brand-light: #ff8fb0;
      --color-button: #ca0055;
      --color-on-button: #fafafa;
      --color-focus: #ca0055;
      /* Logo fills, from ../src/components/Logo.tsx */
      --color-logo-letters: #ffffff;
      --color-logo-ink: #0d0c0c;
      --font-body: "Roboto", Arial, sans-serif;

      --space-xs: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 40px;
      --space-2xl: 64px;
      --gutter: 32px;
      --container: 1200px;
      --radius-card: 12px;
      --radius-control: 8px;
      --text-sm: 0.875rem;
      --text-md: 1rem;
      --text-lead: clamp(1.125rem, 0.4vw + 1rem, 1.375rem);
      --text-display: clamp(3.25rem, 8vw + 1rem, 9rem);
      --dur-micro: 120ms;
      --beat: 2.8s;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-paper: #07080c;
        --color-surface: #1b1e2a;
        --color-ink: #fafafa;
        --color-ink-2: #abb1c1;
        --color-button: #ff3776;
        --color-on-button: #131215;
        --color-focus: #ff8fb0;
        --color-logo-ink: #ffffff;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { overflow-x: clip; }
    body {
      margin: 0;
      background: var(--color-paper);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-md);
      font-synthesis: none;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    svg { display: block; }

    .page {
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: min(100% - 2 * var(--gutter), var(--container));
      min-height: 100svh;
      margin-inline: auto;
    }
    .header { padding-block: var(--space-lg); }
    .logo { width: 96px; height: auto; aspect-ratio: 1038 / 442; }
    .fill-brand { fill: var(--color-brand); }
    .fill-pure-white { fill: var(--color-logo-letters); }
    .fill-brand-ink { fill: var(--color-logo-ink); }

    /* The home page's top row: a content card beside a brand-pink card. */
    .stage {
      display: grid;
      grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
      align-self: center;
      height: 100%;
      max-height: 880px;
      gap: var(--space-md);
    }
    .message {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: var(--space-lg);
      padding: var(--space-2xl);
      border-radius: var(--radius-card);
      background: var(--color-surface);
    }
    h1 {
      margin: 0;
      max-width: 8ch;
      font-size: var(--text-display);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.02;
      text-wrap: balance;
      overflow-wrap: break-word;
      min-width: 0;
    }
    .lead {
      margin: 0;
      max-width: 34ch;
      font-size: var(--text-lead);
      line-height: 1.45;
      text-wrap: pretty;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-md) var(--space-lg);
      margin-top: var(--space-xs);
    }
    .button {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding-inline: var(--space-lg);
      border-radius: var(--radius-control);
      background: var(--color-button);
      color: var(--color-on-button);
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      transition: background-color var(--dur-micro) ease-out, transform var(--dur-micro) ease-out;
    }
    .button:hover { background: color-mix(in oklab, var(--color-button) 85%, var(--color-ink)); }
    .button:active { transform: translateY(1px); }
    .link {
      color: var(--color-ink);
      font-weight: 700;
      text-decoration: underline;
      text-decoration-color: var(--color-brand);
      text-decoration-thickness: 2px;
      text-underline-offset: 0.25em;
      white-space: nowrap;
      transition: text-decoration-color var(--dur-micro) ease-out;
    }
    .link:hover { text-decoration-color: var(--color-ink); }
    .link:active { color: var(--color-ink-2); }
    .button:focus-visible, .link:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 3px;
    }

    .beat {
      position: relative;
      min-height: 280px;
      overflow: hidden;
      border-radius: var(--radius-card);
      background: var(--color-brand);
    }
    .beat-art { position: absolute; inset: 0; width: 100%; height: 100%; }
    .ring { fill: none; stroke: var(--color-brand-light); stroke-width: 2; }
    .heart-fill { fill: var(--color-logo-letters); }
    .heart-letter { fill: var(--color-brand); }
    .heart {
      transform-box: fill-box;
      transform-origin: center;
      animation: heartbeat var(--beat) ease-in-out infinite;
    }
    @keyframes heartbeat {
      0%, 30%, 100% { transform: scale(1); }
      7% { transform: scale(1.06); }
      14% { transform: scale(1); }
      21% { transform: scale(1.04); }
    }

    .footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: var(--space-xs) var(--space-lg);
      padding-block: var(--space-lg);
      color: var(--color-ink-2);
      font-size: var(--text-sm);
    }

    @media (max-width: 760px) {
      :root { --gutter: 16px; }
      .header { padding-block: var(--space-md); }
      .logo { width: 84px; }
      .stage { grid-template-columns: minmax(0, 1fr); height: auto; max-height: none; }
      .message { padding: var(--space-xl) var(--space-lg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .heart { animation: none; }
      .button, .link { transition: none; }
    }
    @media (forced-colors: active) {
      .message, .beat { border: 1px solid CanvasText; }
      .fill-brand, .fill-brand-ink, .heart-fill { fill: CanvasText; }
      .fill-pure-white, .heart-letter { fill: Canvas; }
      .ring { stroke: CanvasText; }
    }
  </style>
</head>
